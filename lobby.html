<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="animic-favicon.svg" />
    <title>ロビー | Animic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&family=Zen+Kaku+Gothic+New:wght@500;700&family=Montserrat:ital,wght@1,500&family=JetBrains+Mono:wght@700&display=swap"
    />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="transition.css" />
    <script>
      // 前の画面から塗りつぶして来た場合、描画前に中身を隠す
      try {
        if (sessionStorage.getItem("animic-wipe")) document.documentElement.classList.add("wipe-pending");
      } catch {}
    </script>
    <style>
      .bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem clamp(1rem, 4vw, 3rem);
        background: rgb(245 246 248 / 0.85);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }

      .bar img {
        display: block;
        width: 8.5rem;
        height: auto;
      }

      .leave {
        padding: 0.5rem 1rem;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: #fff;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--ink);
        cursor: pointer;
      }

      .lobby {
        position: relative;
        z-index: 1;
        width: min(100%, 68rem);
        margin: 0 auto;
        padding: clamp(1.25rem, 4vw, 3rem) 16px 3rem;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
        gap: 1.5rem;
        align-items: start;
      }

      .lobby-title {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem 1rem;
      }

      .lobby-title h1 {
        margin: 0;
        font-family: var(--round);
        font-weight: 900;
        font-size: clamp(1.6rem, 4.5vw, 2.4rem);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 700;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .status::before {
        content: "";
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: var(--yellow);
        box-shadow: 0 0 0 4px rgb(253 219 19 / 0.25);
      }

      .status.is-ready::before {
        background: #22c55e;
        box-shadow: 0 0 0 4px rgb(34 197 94 / 0.2);
      }

      .panel {
        padding: clamp(1.25rem, 3.5vw, 1.75rem);
        background: #fff;
        border-radius: 1.5rem;
        box-shadow: 0 20px 50px -30px rgb(11 27 43 / 0.35);
        display: grid;
        gap: 1rem;
      }

      .panel h2 {
        margin: 0;
        font-size: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .panel h2 small {
        font-weight: 500;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .code {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 0.35rem;
      }

      .code span {
        padding-block: 0.55rem;
        border-radius: 0.55rem;
        background: #fff0f7;
        text-align: center;
        font-family: var(--mono);
        font-weight: 700;
        font-size: clamp(1.15rem, 4.5vw, 1.6rem);
      }

      .share {
        display: flex;
        gap: 0.5rem;
      }

      .share input {
        flex: 1;
        min-width: 0;
        padding: 0.7rem 0.9rem;
        border: 2px solid var(--line);
        border-radius: 0.8rem;
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--muted);
        background: var(--ground);
      }

      .small-btn {
        flex: none;
        padding: 0.7rem 1rem;
        border: 2px solid var(--ink);
        border-radius: 0.8rem;
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
      }

      .small-btn.ghost {
        background: #fff;
        color: var(--ink);
      }

      .qr {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.9rem;
        border: 2px dashed var(--line);
        border-radius: 1rem;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .qr canvas {
        flex: none;
        width: 5.5rem;
        height: 5.5rem;
        image-rendering: pixelated;
      }

      .members {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.6rem;
      }

      .member {
        display: grid;
        grid-template-columns: 2.75rem 1fr auto;
        align-items: center;
        gap: 0.8rem;
        padding: 0.75rem 0.9rem;
        border: 2px solid var(--line);
        border-radius: 1rem;
      }

      .member.is-empty {
        border-style: dashed;
        color: var(--muted);
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 50%;
        font-family: var(--round);
        font-weight: 900;
        font-size: 1.1rem;
        color: #fff;
      }

      .member.is-empty .avatar {
        background: var(--ground);
      }

      .member-name {
        min-width: 0;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .member-name small {
        display: block;
        font-weight: 500;
        font-size: 0.75rem;
        color: var(--muted);
      }

      .badge {
        display: inline-block;
        margin-left: 0.35rem;
        padding: 0.05rem 0.45rem;
        border-radius: 0.35rem;
        background: var(--yellow);
        font-size: 0.68rem;
        vertical-align: 0.15em;
      }

      .ready {
        padding: 0.3rem 0.7rem;
        border-radius: 999px;
        background: var(--ground);
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--muted);
        white-space: nowrap;
      }

      .ready.is-on {
        background: #dcfce7;
        color: #15803d;
      }

      .dots::after {
        content: "";
        animation: dots 1.4s steps(4) infinite;
      }

      @keyframes dots {
        0% { content: ""; }
        25% { content: "."; }
        50% { content: ".."; }
        75% { content: "..."; }
      }

      .settings {
        display: grid;
        gap: 0.9rem;
      }

      .setting {
        display: grid;
        gap: 0.4rem;
        margin: 0;
        padding: 0;
        border: 0;
      }

      .setting legend {
        padding: 0;
        margin-bottom: 0.4rem;
        font-size: 0.85rem;
        font-weight: 700;
      }

      .seg {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        padding: 0.25rem;
        border-radius: 999px;
        background: var(--ground);
      }

      .seg input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .seg label {
        padding: 0.55rem 0.4rem;
        border-radius: 999px;
        text-align: center;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
      }

      .seg input:checked + label {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 2px 8px rgb(11 27 43 / 0.12);
      }

      .seg input:focus-visible + label {
        outline: 3px solid var(--cyan);
      }

      .seg input:disabled + label {
        cursor: default;
      }

      .actions {
        display: grid;
        gap: 0.75rem;
      }

      .actions .note {
        margin: 0;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
      }

      /* カウントダウン */
      .countdown {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 1rem;
        padding: 16px;
        background: rgb(11 27 43 / 0.82);
        color: #fff;
        text-align: center;
      }

      .countdown-num {
        font-family: var(--round);
        font-weight: 900;
        font-size: clamp(6rem, 30vw, 12rem);
        line-height: 1;
        color: var(--yellow);
        animation: pop 0.9s ease-out;
      }

      @keyframes pop {
        from { transform: scale(1.6); opacity: 0; }
        30% { transform: scale(1); opacity: 1; }
      }

      .countdown p {
        margin: 0;
        font-weight: 700;
      }

      .countdown .pill {
        width: auto;
        margin-top: 1rem;
      }

      @media (max-width: 820px) {
        .lobby {
          grid-template-columns: minmax(0, 1fr);
          padding-bottom: calc(8.5rem + env(safe-area-inset-bottom, 0px));
        }
        .room-panel {
          order: 2;
        }
        /* 下部に固定したボタンを含むパネルを前面に（登場アニメーション中も隠れないように） */
        .panel[data-enter="fade"] {
          position: relative;
          z-index: 6;
        }
        /* スマホでは開始ボタンを画面下に固定 */
        .actions {
          position: fixed;
          z-index: 6;
          left: 0;
          right: 0;
          bottom: 0;
          padding: 0.9rem 16px calc(0.9rem + env(safe-area-inset-bottom, 0px));
          background: #fff;
          border-top: 1px solid var(--line);
          box-shadow: 0 -10px 30px -20px rgb(11 27 43 / 0.4);
        }
        .qr canvas {
          width: 4.5rem;
          height: 4.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .countdown-num,
        .dots::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a href="index.html"><img src="animic-logo.svg" alt="Animic トップ" width="2078" height="607" /></a>
      <button class="leave" type="button" id="leave">退出</button>
    </header>

    <main class="lobby">
      <div class="lobby-title" data-enter>
        <h1>ロビー</h1>
        <span class="status" id="status">対戦相手を待っています</span>
      </div>

      <section class="panel room-panel" aria-labelledby="room-title" data-enter>
        <h2 id="room-title">ルームコード <small>相手に伝えてね</small></h2>
        <div class="code" id="code"></div>
        <div class="share">
          <input id="room-url" readonly aria-label="ルームURL" />
          <button class="small-btn" type="button" id="copy">コピー</button>
        </div>
        <div class="qr">
          <canvas id="qr" width="21" height="21" aria-label="ルームURLのQRコード（モック）"></canvas>
          <span>スマホで読み取って参加できます。<br />（QRコードはモックです）</span>
        </div>
      </section>

      <div class="panel" data-enter="fade">
        <h2>参加者 <small id="member-count">1 / 2人</small></h2>
        <ul class="members" id="members"></ul>

        <div class="settings" id="settings">
          <fieldset class="setting">
            <legend>難易度</legend>
            <div class="seg">
              <input type="radio" name="level" id="lv-easy" value="かんたん" checked /><label for="lv-easy">かんたん</label>
              <input type="radio" name="level" id="lv-normal" value="ふつう" /><label for="lv-normal">ふつう</label>
              <input type="radio" name="level" id="lv-hard" value="むずかしい" /><label for="lv-hard">むずかしい</label>
            </div>
          </fieldset>
          <fieldset class="setting">
            <legend>制限時間</legend>
            <div class="seg">
              <input type="radio" name="time" id="t-60" value="60" /><label for="t-60">60秒</label>
              <input type="radio" name="time" id="t-90" value="90" checked /><label for="t-90">90秒</label>
              <input type="radio" name="time" id="t-120" value="120" /><label for="t-120">120秒</label>
            </div>
          </fieldset>
        </div>

        <div class="actions">
          <button class="pill" type="button" id="ready">準備完了にする</button>
          <button class="pill pill-pink" type="button" id="start" disabled>対戦をはじめる</button>
          <p class="note" id="note">2人そろうと開始できます</p>
        </div>
      </div>
    </main>

    <dialog class="dialog" id="leave-dialog">
      <form class="card" method="dialog">
        <h1>ルームを出ますか？</h1>
        <p class="sub">ホストの場合は、相手にホストを引き継ぎます。</p>
        <div class="dialog-actions">
          <button class="pill" value="cancel">やめる</button>
          <button class="pill pill-pink" value="leave">退出する</button>
        </div>
      </form>
    </dialog>

    <div class="countdown" id="countdown" hidden>
      <p id="countdown-label">かんたん・90秒</p>
      <div class="countdown-num" id="countdown-num">3</div>
      <p id="countdown-sub">お題が公開されます</p>
    </div>


    <script src="common.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const q = params();
      const code = isValidCode(q.get("code") || "") ? q.get("code") : randomCode();
      const me = { name: escapeHtml(q.get("name") || "ゲスト"), via: escapeHtml(q.get("via") || ""), host: q.get("role") !== "guest", ready: false, color: "#ff2d87" };
      const other = { name: me.host ? "ぴよ丸" : "ホストさん", via: null, host: !me.host, ready: false, color: "#00b4fc", here: !me.host };

      // ルームコードとURL
      $("code").innerHTML = [...code].map((ch) => `<span>${ch}</span>`).join("");
      $("code").setAttribute("aria-label", code);
      $("room-url").value = `https://animic.app/rooms/${code}`;
      playWipeOut();
      $("copy").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText($("room-url").value);
          toast("URLをコピーしました");
        } catch {
          $("room-url").select();
          toast("URLを選択しました");
        }
      });

      // QRっぽい模様（モック）
      (() => {
        const ctx = $("qr").getContext("2d");
        let seed = [...code].reduce((a, c) => a * 31 + c.charCodeAt(0), 7);
        const rand = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, 21, 21);
        ctx.fillStyle = "#0b1b2b";
        for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) if (rand() > 0.55) ctx.fillRect(x, y, 1, 1);
        for (const [x, y] of [[0, 0], [14, 0], [0, 14]]) {
          ctx.fillStyle = "#0b1b2b"; ctx.fillRect(x, y, 7, 7);
          ctx.fillStyle = "#fff"; ctx.fillRect(x + 1, y + 1, 5, 5);
          ctx.fillStyle = "#0b1b2b"; ctx.fillRect(x + 2, y + 2, 3, 3);
        }
      })();

      // 参加者
      function memberRow(p, isMe) {
        const via = p.via ? `${p.via}でログイン` : "ゲスト";
        return `<li class="member">
          <span class="avatar" style="background:${p.color}">${[...p.name][0]}</span>
          <span class="member-name">${p.name}${p.host ? '<span class="badge">ホスト</span>' : ""}<small>${isMe ? "あなた・" : ""}${via}</small></span>
          <span class="ready ${p.ready ? "is-on" : ""}">${p.ready ? "準備OK" : "準備中"}</span>
        </li>`;
      }

      function render() {
        const list = [me.host ? me : other, me.host ? other : me].filter((p) => p === me || other.here);
        $("members").innerHTML =
          list.map((p) => memberRow(p, p === me)).join("") +
          (other.here ? "" : `<li class="member is-empty"><span class="avatar"></span><span class="member-name">対戦相手<small class="dots">参加を待っています</small></span><span></span></li>`);
        $("member-count").textContent = `${list.length} / 2人`;

        const bothHere = other.here;
        $("status").textContent = !bothHere ? "対戦相手を待っています" : me.ready && other.ready ? "全員準備OK" : "そろいました";
        $("status").classList.toggle("is-ready", bothHere);

        $("ready").textContent = me.ready ? "準備完了を取り消す" : "準備完了にする";
        $("settings").querySelectorAll("input").forEach((i) => (i.disabled = !me.host));
        $("start").hidden = !me.host;
        $("start").disabled = !bothHere;
        $("note").textContent = me.host
          ? bothHere
            ? other.ready ? "全員の準備ができました" : "準備完了を待たずに開始することもできます"
            : "2人そろうと開始できます"
          : "ホストが開始するのを待っています";
      }
      render();

      // 相手の動き（モック）
      (async () => {
        if (!other.here) {
          await wait(3000);
          other.here = true;
          render();
          toast(`${other.name} さんが参加しました`);
        }
        await wait(2500);
        other.ready = true;
        render();
      })();

      $("ready").addEventListener("click", async () => {
        me.ready = !me.ready;
        render();
        // ゲストのときは、準備完了するとホストが開始する想定
        if (!me.host && me.ready && other.here) {
          await wait(1800);
          if (me.ready) startCountdown();
        }
      });

      $("start").addEventListener("click", startCountdown);

      async function startCountdown() {
        const level = document.querySelector("[name=level]:checked").value;
        const time = document.querySelector("[name=time]:checked").value;
        $("countdown-label").textContent = `${level}・${time}秒`;
        $("countdown").hidden = false;
        for (const n of [3, 2, 1]) {
          const el = $("countdown-num");
          el.textContent = n;
          el.style.animation = "none";
          el.offsetWidth;
          el.style.animation = "";
          await wait(900);
        }
        $("countdown-num").textContent = "START!";
        $("countdown-num").style.fontSize = "clamp(3.5rem, 16vw, 7rem)";
        $("countdown-sub").textContent = "お題を公開します";
        await wait(700);
        // 対戦画面へ（名前はエスケープ前の値を渡す）
        wipeTo("play.html", {
          code,
          level,
          time,
          name: q.get("name") || "ゲスト",
          opp: other.name,
          role: me.host ? "host" : "guest",
        });
      }

      // 退出
      $("leave").addEventListener("click", () => $("leave-dialog").showModal());
      $("leave-dialog").addEventListener("close", () => {
        if ($("leave-dialog").returnValue === "leave") go("index.html");
      });
    </script>
  </body>
</html>
