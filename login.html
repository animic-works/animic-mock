<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="images/animic-favicon.svg" />
    <title>ログイン | Animic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&family=Zen+Kaku+Gothic+New:wght@500;700&family=Montserrat:ital,wght@1,500&family=JetBrains+Mono:wght@700&display=swap"
    />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="transition.css" />
    <script>
      // 前の画面から塗りつぶして来た場合、描画前に中身を隠す
      try {
        if (sessionStorage.getItem("animic-wipe")) document.documentElement.classList.add("wipe-pending");
      } catch {}
    </script>
    <style>
      .providers {
        display: grid;
        gap: 0.75rem;
      }

      .provider {
        display: grid;
        grid-template-columns: 1.5rem 1fr 1.5rem;
        padding: 0.95rem 1.25rem;
        border-width: 1px;
        border-color: #c7cbd1;
        font-size: 1rem;
        letter-spacing: 0.03em;
      }

      .provider > svg,
      .provider > .spinner {
        width: 1.4rem;
        height: 1.4rem;
      }

      .provider-discord {
        border-color: var(--discord);
        color: #fff;
        background: var(--discord);
      }

      .provider-x {
        border-color: #000;
        color: #fff;
        background: #000;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      .guest-note {
        margin: -0.4rem 0 0;
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.7;
      }

      .context {
        margin: -0.4rem 0 0;
        padding: 0.6rem 0.9rem;
        border-radius: 0.8rem;
        background: #fff0f7;
        text-align: center;
        font-size: 0.85rem;
      }

      .context code {
        font-family: var(--mono);
        letter-spacing: 0.12em;
      }

      .terms {
        margin: 0.25rem 0 0;
        padding-top: 1rem;
        border-top: 1px dashed var(--line);
        text-align: center;
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.7;
      }

      .terms a {
        color: var(--ink);
      }

      .welcome {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        border-radius: 1rem;
        background: var(--ground);
        font-size: 0.85rem;
        color: var(--muted);
      }

      .welcome svg {
        width: 1.4rem;
        height: 1.4rem;
        flex: none;
        color: var(--ink);
      }

      .welcome b {
        display: block;
        color: var(--ink);
      }

      /* ステップの切り替え: 今のカードが左へ抜け、次のカードが右から入る */
      .step-out {
        animation: step-out 0.28s ease-in forwards;
      }

      .step-in {
        animation: step-in 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.15) both;
      }

      .step-in.is-back {
        animation-name: step-in-back;
      }

      .step-out.is-back {
        animation-name: step-out-back;
      }

      @keyframes step-out {
        to {
          opacity: 0;
          transform: translateX(-2.5rem) rotate(-2deg);
        }
      }

      @keyframes step-in {
        from {
          opacity: 0;
          transform: translateX(2.5rem) rotate(2deg);
        }
      }

      @keyframes step-out-back {
        to {
          opacity: 0;
          transform: translateX(2.5rem) rotate(2deg);
        }
      }

      @keyframes step-in-back {
        from {
          opacity: 0;
          transform: translateX(-2.5rem) rotate(-2deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .step-out,
        .step-in {
          animation: none;
        }
      }

      .link-button {
        justify-self: center;
        padding: 0;
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 0.85rem;
        text-decoration: underline;
        cursor: pointer;
      }
      /* ---------- スマホ: アプリ風。上にキャラ、下にボトムシート ---------- */
      .m-appbar,
      .m-hero {
        display: none;
      }

      @media (max-width: 560px) {
        .deco,
        .back,
        .card-logo {
          display: none;
        }

        /* 上部のアプリバー: 左に戻る、中央にロゴ */
        .m-appbar {
          position: fixed;
          z-index: 5;
          top: 0;
          left: 0;
          right: 0;
          display: grid;
          grid-template-columns: 48px 1fr 48px;
          align-items: center;
          height: calc(56px + env(safe-area-inset-top, 0px));
          padding: env(safe-area-inset-top, 0px) 8px 0;
          pointer-events: none;
        }

        .m-appbar > * {
          pointer-events: auto;
        }

        .m-icon-btn {
          display: grid;
          place-items: center;
          width: 48px;
          height: 48px;
          border-radius: 50%;
          background: rgb(255 255 255 / 0.92);
          color: var(--ink);
          box-shadow: 0 6px 16px -8px rgb(11 27 43 / 0.45);
        }

        .m-icon-btn:active {
          transform: scale(0.94);
        }

        .m-appbar-logo {
          justify-self: center;
          width: auto;
          height: 38px;
        }

        .page {
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          place-items: stretch;
          padding: 0;
        }

        /* 下のシートのおおよその高さ。キャラの置き場所はこの値で決め、
           ステップが変わってシートの高さが変わってもキャラが動かないようにする */
        .page {
          --sheet-h: 440px;
          /* キャラと星を置く上側の領域の高さ（シートに28pxもぐる） */
          --stage-h: calc(100svh - var(--sheet-h) + 28px);
        }

        /* キャラを大きく見せる領域。ページ全体に敷いて、シートの裏まで絵と背景を続ける。
           シートを入れ替えるアニメーションでシートが透けても、裏に何もない状態を見せない。
           斜めのストライプは上側の領域（幅100vw×--stage-h）を基準にpxで位置を決め、
           領域をページ全体に広げても見た目が変わらないようにする（112degの
           グラデーション線の長さ = 0.927×幅 + 0.375×高さ。0%の線は左上の角を通る） */
        .m-hero {
          --gl: calc(0.927 * 100vw + 0.375 * var(--stage-h));
          position: absolute;
          inset: 0;
          display: block;
          overflow: hidden;
          background:
            linear-gradient(
              112deg,
              transparent 0 calc(0.58 * var(--gl)),
              #00b4fc calc(0.58 * var(--gl)) calc(0.592 * var(--gl)),
              transparent calc(0.592 * var(--gl)) calc(0.61 * var(--gl)),
              #ffe4f1 calc(0.61 * var(--gl)) calc(0.88 * var(--gl)),
              #fddb13 calc(0.88 * var(--gl)) calc(0.892 * var(--gl)),
              transparent calc(0.892 * var(--gl))
            );
        }

        /* キャラと星を置く範囲。シートを除いた上側（シートに28pxもぐる） */
        .m-hero-stage {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: var(--stage-h);
          min-height: 15rem;
        }

        .m-hero-char {
          position: absolute;
          /* 下のシートを除いた高さに収まる大きさにする（低い画面では小さく） */
          top: calc(50% + 14px);
          left: 50%;
          width: min(116vw, 34rem, (100vh - var(--sheet-h)) * 1.75);
          width: min(116vw, 34rem, (100svh - var(--sheet-h)) * 1.75);
          transform: translate(-54%, -50%) rotate(-10deg);
        }

        .m-hero-char img {
          display: block;
          width: 100%;
          height: auto;
          filter:
            drop-shadow(0.4rem 0.9rem 0 rgb(255 114 185 / 0.9))
            drop-shadow(0 20px 24px rgb(255 45 135 / 0.18));
          animation: m-float 6s ease-in-out infinite;
        }

        .m-spark {
          position: absolute;
          width: 2.4rem;
          height: auto;
          animation: m-twinkle 2.8s ease-in-out infinite;
          animation-delay: var(--d, 0s);
        }

        @keyframes m-float {
          50% {
            transform: translateY(-8px);
          }
        }

        @keyframes m-twinkle {
          50% {
            opacity: 0.35;
            transform: scale(0.7) rotate(20deg);
          }
        }

        /* 下のボトムシート */
        .card {
          position: relative;
          z-index: 2;
          width: 100%;
          gap: 0.9rem;
          padding: 1.9rem 16px max(16px, env(safe-area-inset-bottom, 0px));
          border-radius: 28px 28px 0 0;
          box-shadow: 0 -14px 34px -20px rgb(11 27 43 / 0.4);
        }

        /* つまみ */
        .card::before {
          content: "";
          position: absolute;
          top: 0.7rem;
          left: 50%;
          width: 40px;
          height: 5px;
          margin-left: -20px;
          border-radius: 999px;
          background: var(--line);
        }

        .card h1 {
          font-size: 1.45rem;
        }

        .sub {
          margin: -0.5rem 0 0.2rem;
          font-size: 0.85rem;
        }

        .provider,
        .pill {
          min-height: 52px;
          padding-block: 0.8rem;
        }

        .terms {
          margin: 0;
          padding-top: 0.8rem;
          font-size: 0.78rem;
        }

        .link-button {
          min-height: 48px;
          padding: 0 1rem;
        }

        /* ステップの切り替えは、シートの中身が下から入れ替わる動きにする */
        .step-out,
        .step-out.is-back {
          animation: m-sheet-out 0.22s ease-in forwards;
        }

        .step-in,
        .step-in.is-back {
          animation: m-sheet-in 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1) both;
        }

        @keyframes m-sheet-out {
          to {
            opacity: 0;
            transform: translateY(1.5rem);
          }
        }

        @keyframes m-sheet-in {
          from {
            opacity: 0;
            transform: translateY(2.5rem);
          }
        }
      }

      @media (max-width: 560px) and (prefers-reduced-motion: reduce) {
        .m-hero-char img,
        .m-spark {
          animation: none;
        }
      }
    </style>
  </head>

              <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" />

    <script src="common.js"></script>
    <script>
      playWipeOut();
      const q = params();
      const code = q.get("code");
      const joining = q.get("next") === "join" && isValidCode(code || "");
      let provider = null;

      const $ = (id) => document.getElementById(id);
      if (joining) {
        $("context").hidden = false;
        $("context").innerHTML = `ルーム <code>${code}</code> に参加します`;
        $("name-submit").textContent = "ルームに参加";
      }

      // カードを入れ替える（back: 前のステップへ戻るとき）
      async function swapStep(from, to, back = false) {
        if (!reducedMotion) {
          from.classList.toggle("is-back", back);
          from.classList.add("step-out");
          await wait(280);
          from.classList.remove("step-out", "is-back");
        }
        from.hidden = true;
        to.hidden = false;
        if (!reducedMotion) {
          to.classList.toggle("is-back", back);
          to.classList.add("step-in");
          to.addEventListener("animationend", () => to.classList.remove("step-in", "is-back"), { once: true });
        }
      }

      async function showNameStep(name) {
        const input = $("display-name");
        input.value = name || "";
        $("name-submit").disabled = !input.value.trim();
        await swapStep($("step-method"), $("step-name"));
        input.focus();
      }

      document.querySelectorAll(".provider").forEach((button) => {
        button.addEventListener("click", async () => {
          document.querySelectorAll(".provider, #guest").forEach((b) => (b.disabled = true));
          const icon = button.querySelector("svg");
          const label = button.querySelector("span");
          const original = label.textContent;
          const spinner = Object.assign(document.createElement("span"), { className: "spinner" });
          icon.replaceWith(spinner);
          label.textContent = `${button.dataset.provider}に接続中…`;
          await wait(1100);
          spinner.replaceWith(icon);
          label.textContent = original;
          document.querySelectorAll(".provider, #guest").forEach((b) => (b.disabled = false));

          provider = button.dataset.provider;
          const text = document.createElement("div");
          text.innerHTML = `<b>${provider}でログインしました</b>アカウント名を表示名に入れています。`;
          $("welcome").replaceChildren(icon.cloneNode(true), text);
          $("welcome").hidden = false;
          showNameStep(button.dataset.name);
        });
      });

      $("guest").addEventListener("click", () => {
        provider = null;
        $("welcome").hidden = true;
        showNameStep("");
      });

      $("display-name").addEventListener("input", (event) => {
        $("name-submit").disabled = !event.target.value.trim();
      });

      $("change-method").addEventListener("click", () => swapStep($("step-name"), $("step-method"), true));

      $("name-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const name = $("display-name").value.trim();
        if (!name) return;
        const submit = $("name-submit");
        submit.disabled = true;
        const query = { name, code: joining ? code : randomCode(), role: joining ? "guest" : "host", via: provider };
        buildRoomTo(query, joining
          ? { label: "ルームに参加しています", done: "ルームに入りました！", sub: `${name} さんとして参加` }
          : { label: "ルームを作っています", done: "ルームができました！", sub: "このコードを相手に伝えよう" });
      });
    </script>
  </body>
</html>
