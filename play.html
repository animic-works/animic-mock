          padding: 0.2rem;
          box-shadow: none;
        }
        .member {
          gap: 0.35rem;
          width: 6.4rem;
          padding: 0.15rem 0.5rem 0.15rem 0.15rem;
        }
        .roster.is-narrow .member {
          width: 4.9rem;
        }
        .m-avatar {
          width: 1.7rem;
          height: 1.7rem;
          font-size: 0.72rem;
        }
        .m-name {
          font-size: 0.7rem;
        }
        .m-state {
          font-size: 0.56rem;
        }
        .phase {
          border-radius: 18px;
          gap: 0.5rem;
          padding: 1rem;
        }
        .phase-title {
          font-size: 1.5rem;
        }
        .phase-note {
          font-size: 0.72rem;
        }

        .play {
          height: max(calc(100svh - var(--bar-h) - var(--track-h)), 31rem);
          padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
          gap: 12px;
        }
        /* 1画面に固定するので、登場は位置を動かさずフェードだけにする */
        .is-entering .play [data-enter] {
          animation-name: fade-in;
        }
        .panel {
          padding: 0.75rem 0.8rem 0.85rem;
          border-radius: 20px;
          gap: 0.6rem;
        }
        .panel-head .eyebrow {
          display: none;
        }
        .panel-head h2 {
          font-size: 0.95rem;
        }
        .panel-head .hint {
          padding: 0.2rem 0.6rem;
          font-size: 0.66rem;
        }

        /* 比較: 幅で大きさを決め、ラベルは画像の上の札だけにする */
        .stage {
          gap: 0.7rem;
        }
        .compare {
          container-type: normal;
          gap: 10px;
        }
        /* 縦長の枠は高さを画面の 27% までにして、下のプロンプト欄の高さを残す */
        .compare {
          justify-content: center;
          grid-template-columns: repeat(2, min(calc(50% - 5px), calc(23svh * 832 / 1216)));
        }
        .compare-item {
          width: 100%;
        }
        /* 画像の上に何も重ねないので、ラベルは短く画像の下に出す */
        .compare-label {
          gap: 0.3rem;
          font-size: 0.7rem;
        }
        .compare-label small {
          display: none;
        }
        .lv-badge {
          margin-left: 0.2rem;
        }
        .frame {
          border-radius: 12px;
        }
        .approx {
          top: 50%;
          width: 2.1rem;
          height: 2.1rem;
          border-width: 2px;
        }
        .approx svg {
          width: 1rem;
          height: 1rem;
        }
        .tag {
          left: 0.4rem;
          top: 0.4rem;
          padding: 0.12rem 0.5rem;
          font-size: 0.54rem;
          letter-spacing: 0.14em;
        }
        .tag-new {
          right: 0.4rem;
          top: 0.4rem;
          font-size: 0.6rem;
          padding: 0.15rem 0.45rem;
        }
        .stage-empty {
          gap: 0.4rem;
          font-size: 0.7rem;
          line-height: 1.5;
        }
        .stage-empty .kbd {
          display: none;
        }
        .gen-hud {
          left: 0.35rem;
          right: 0.35rem;
          bottom: 0.35rem;
          padding: 0.35rem 0.5rem 0.45rem;
          gap: 0.3rem;
        }
        .gen-hud-row {
          font-size: 0.55rem;
        }
        .gen-hud-row span:last-child {
          display: none;
        }
        .level-cap {
          padding: 2.2rem 0.5rem 0.45rem;
        }
        .level-word {
          font-size: 0.95rem;
          -webkit-text-stroke-width: 1px;
        }
        .level-word b {
          font-size: 0.5rem;
          padding: 0.1rem 0.4rem;
        }
        .level-desc {
          font-size: 0.66rem;
        }
        .level-desc span + span {
          margin-left: 0.35rem;
          padding-left: 0.35rem;
        }
        .level-tag {
          top: 0.4rem;
          left: 0.4rem;
          padding: 0.12rem 0.45rem;
          font-size: 0.5rem;
          letter-spacing: 0.12em;
        }
        .zoom-hint {
          top: 0.35rem;
          right: 0.35rem;
          width: 1.5rem;
          height: 1.5rem;
          background-size: 0.75rem;
        }

        .stage-foot {
          grid-template-columns: minmax(0, 1fr) auto;
          align-items: center;
          gap: 0.6rem;
          padding-top: 0.6rem;
        }
        .history {
          gap: 0.2rem;
        }
        .history-title {
          display: none;
        }
        .shots {
          min-height: 3.6rem;
          gap: 0.45rem;
          padding: 0.4rem 0.3rem 0.45rem;
        }
        .shots:empty::before {
          content: "生成した画像が並びます";
          white-space: nowrap;
          font-size: 0.66rem;
          border-radius: 12px;
        }
        .shot {
          width: 3.1rem;
          height: 3.1rem;
          border-radius: 11px;
        }
        .shot:hover:not(:disabled) {
          transform: none;
        }
        /* スマホは幅がないので、スイッチは確認のモーダルの中だけに出す */
        .submit-box .quick {
          display: none;
        }
        .submit-box .key {
          min-width: 0;
          min-height: 3rem;
          padding: 0 1rem;
          font-size: 0.88rem;
          letter-spacing: 0.04em;
        }

        /* 入力: 入力欄 → 表現の一覧（残りの高さ・縦スクロール） → 回数と生成 */
        .compose {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto minmax(0, 1fr) auto;
          grid-template-areas:
            "head"
            "prompt"
            "chips"
            "foot";
        }
        .seg button {
          padding: 0.3rem 0.75rem;
          font-size: 0.72rem;
        }
        /* スマホ: よく使う表現の一覧は出さず（「プロンプトを検索」で選べる）、プロンプト欄に高さを回す */
        .compose .chips {
          display: none;
        }
        .compose {
          grid-template-rows: auto minmax(0, 1fr) auto;
          grid-template-areas:
            "head"
            "prompt"
            "foot";
        }
        .prompt-box {
          min-height: 0;
        }
        .tokens {
          min-height: 2.9rem;
          max-height: none;
          padding: 0.45rem 0.6rem 0.15rem;
        }
        .tok-input {
          font-size: 16px; /* iOS で入力時に拡大されないように */
        }
        .prompt-tools {
          padding: 0.15rem 0.35rem 0.3rem 0.8rem;
        }
        .prompt-tools .kbd {
          display: none;
        }
        .prompt-len {
          margin-right: auto;
        }
        .clear {
          width: 1.5rem;
          height: 1.5rem;
        }
        .chips {
          display: grid;
          gap: 0.5rem;
          padding: 0 0 0.6rem;
          overflow-x: hidden;
          overflow-y: auto;
          scrollbar-width: none;
          mask-image: linear-gradient(to bottom, #000 calc(100% - 1rem), transparent);
        }
        .chips::-webkit-scrollbar {
          display: none;
        }
        .chip-row {
          display: grid;
          grid-template-columns: 3rem minmax(0, 1fr);
          align-items: start;
        }
        .chip-row > span {
          padding-top: 0.5rem;
          font-size: 0.64rem;
        }
        .chip-opts {
          flex-wrap: wrap;
        }
        .chips button {
          min-height: 2.1rem;
          padding: 0.25rem 0.7rem;
          font-size: 0.78rem;
        }
        .chips button:hover:not(:disabled) {
          border-color: var(--line);
          transform: none;
        }
        .chips button[aria-pressed="true"]:hover:not(:disabled) {
          border-color: var(--ink);
        }
        .compose-foot {
          grid-template-columns: auto minmax(0, 1fr);
          gap: 0.75rem;
        }
        .meter {
          display: grid;
          gap: 0.2rem;
          min-height: 0;
        }
        .meter .eyebrow {
          display: none;
        }
        .count {
          margin: 0;
          font-size: 0.7rem;
        }
        .count b {
          font-size: 1.05rem;
        }
        .count #gen-limit {
          font-size: 0.75rem;
        }
        .pips i {
          width: 0.6rem;
          height: 0.4rem;
        }
        .key {
          min-height: 3rem;
          font-size: 0.95rem;
        }
        .key:hover:not(:disabled) {
          transform: none;
        }

        .toast {
          bottom: 6rem;
        }

        .overlay-card {
          width: 11rem;
        }
        .overlay-bands span:nth-child(1) {
          left: -2rem;
          width: 4rem;
        }
        .overlay-bands span:nth-child(2) {
          left: 2.6rem;
          width: 0.9rem;
        }
        .overlay-bands span:nth-child(3) {
          right: -1.5rem;
          width: 3rem;
        }
        .overlay::after {
          background: radial-gradient(ellipse at 50% 50%, rgb(11 27 43 / 0.92) 30%, rgb(11 27 43 / 0) 75%);
        }

        /* 提出確認は画面下から出るシートにする */
        .dialog:not(.topic-zoom) {
          width: 100%;
          max-width: 100%;
          margin: auto 0 0;
          border-radius: 20px 20px 0 0;
        }
        .dialog:not(.topic-zoom) .card {
          border-radius: 20px 20px 0 0;
          padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        }
        .dialog:not(.topic-zoom)[open] .card {
          animation: sheet-in 0.35s var(--ease-out);
        }
        @keyframes sheet-in {
          from {
            transform: translateY(100%);
          }
        }
      }

      /* 背の低いスマホ（iPhone SE など）: 見出しと余白を削って1画面に収める */
      @media (max-width: 560px) and (max-height: 720px) {
        .stage .panel-head {
          display: none;
        }
        .compare {
          grid-template-columns: repeat(2, min(calc(50% - 5px), calc(17svh * 832 / 1216)));
        }
        .compare-label {
          font-size: 0.64rem;
        }
        .tokens {
          min-height: 2.5rem;
          max-height: 3.6rem;
        }
        .stage-foot {
          padding-top: 0.4rem;
        }
        .shots {
          min-height: 3.2rem;
        }
        .shot {
          width: 2.8rem;
          height: 2.8rem;
        }
        .submit-box .key,
        .key {
          min-height: 2.75rem;
        }
      }

      /* ---------- プロンプト: 切り替えタブ → プロンプト欄（大きい四角） → 検索ボタン2つ → 生成 ----------
         よく使う表現の一覧は出さず、検索のモーダルから選ぶ */
      .compose > .chips {
        display: none !important;
      }
      .compose,
      .compose.is-chips-open {
        grid-template-rows: auto auto minmax(0, 1fr) auto auto;
        grid-template-areas:
          "head"
          "tabs"
          "prompt"
          "search"
          "foot";
        gap: 0.7rem;
      }
      .compose > .panel-head {
        grid-area: head;
      }
      .compose > .ptabs {
        grid-area: tabs;
        padding: 0;
      }
      .compose > .prompt-box {
        grid-area: prompt;
        position: relative;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        min-height: 0;
        overflow: visible !important; /* 入力候補をはみ出して出すため */
      }
      .compose > .psearch {
        grid-area: search;
      }
      .compose > .compose-foot {
        grid-area: foot;
      }
      .compose > .prompt-box .tokens {
        min-height: 0;
        max-height: none;
        padding: 0.75rem 0.8rem 0.4rem;
      }
      .prompt-tools .clear {
        margin-left: auto;
      }

      .psearch {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr));
        gap: 0.5rem;
      }
      .psearch .find {
        justify-content: flex-start;
        gap: 0.5rem;
        margin: 0;
        padding: 0.35rem 0.8rem 0.35rem 0.35rem;
        font-size: 0.74rem;
      }

      /* ベースは緑、キャラは黄色（プロンプト欄のタブと同じ色分け） */
      .psearch-btn {
        --c: #16b37e;
        --soft: #e3f6ee;
        border-color: var(--soft) !important;
        background: var(--soft) !important;
        color: var(--c) !important;
      }

      .psearch-btn.is-base {
        color: #0b7a54 !important;
      }

      .psearch-btn.is-char {
        --c: #f5c400;
        --soft: #fff6cc;
        color: #806500 !important;
      }

      .psearch-btn.is-char .psearch-ico {
        color: var(--ink);
      }

      .psearch-ico {
        display: grid;
        flex: none;
        place-items: center;
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        background: var(--c);
        color: #fff;
        transition: transform 0.25s var(--ease-pop);
      }

      .psearch-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .psearch .find {
        min-width: 0;
      }

      /* 2つ並べて幅が足りないときは「ベースを検索」「キャラを検索」と短くする（欄の幅で判定） */
      .psearch {
        container-type: inline-size;
      }

      /* 横に2つ並ぶ幅（21rem 以上）で 30rem 未満、または縦に並んでも 15rem 未満のとき */
      @container (min-width: 21rem) and (max-width: 30rem) {
        .psearch-mid {
          display: none;
        }
      }

      @container (max-width: 15rem) {
        .psearch-mid {
          display: none;
        }
      }

      .psearch-text b {
        font-weight: 900;
      }

      .psearch-btn:hover:not(:disabled) {
        border-color: var(--c) !important;
      }

      .psearch-btn:hover:not(:disabled) .psearch-ico {
        transform: rotate(-8deg) scale(1.08);
      }

      /* 入力候補: プロンプト欄の下にふわっと出る */
      .suggest {
        position: absolute;
        z-index: 8;
        left: 0.5rem;
        right: 0.5rem;
        top: calc(100% - 0.4rem);
        display: grid;
        gap: 0.1rem;
        max-height: 15rem;
        padding: 0.35rem;
        overflow-y: auto;
        background: #fff;
        border: 2px solid var(--edge);
        border-radius: 1rem;
        box-shadow: 0 18px 40px -16px rgb(11 27 43 / 0.45);
        animation: pop-down 0.18s var(--ease-out);
      }
      @keyframes pop-down {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
      }
      .suggest button {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        padding: 0.5rem 0.7rem;
        border: 0;
        border-radius: 0.7rem;
        background: none;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }
      .suggest button small {
        font-family: var(--mono);
        font-size: 0.66rem;
        font-weight: 500;
        color: var(--muted);
      }
      .suggest button em {
        margin-left: auto;
        font-style: normal;
        font-size: 0.64rem;
        font-weight: 500;
        color: var(--muted);
      }
      .suggest button:hover,
      .suggest button.is-hot {
        background: #fff0f7;
      }
      .suggest mark {
        background: none;
        color: var(--pink);
      }
      .sg-key {
        margin-left: 0.4rem;
        padding: 0.05rem 0.35rem;
        border: 1.5px solid var(--edge);
        border-bottom-width: 3px;
        border-radius: 0.35rem;
        background: #fff;
        font-family: var(--mono);
        font-size: 0.6rem;
        color: var(--muted);
      }

      .suggest-none {
        padding: 0.5rem 0.7rem;
        font-size: 0.74rem;
        color: var(--muted);
      }

      /* タブレット・スマホ: 候補はプロンプト欄の上に出す（下は生成ボタンで隠れるため） */
      @media (max-width: 860px) {
        .suggest {
          top: auto;
          bottom: calc(100% - 0.4rem);
          max-height: 12rem;
        }
      }
      @media (max-width: 560px) {
        .compose,
        .compose.is-chips-open {
          gap: 0.5rem;
        }
        .compose > .prompt-box .tokens {
          min-height: 3.2rem;
          padding: 0.5rem 0.6rem 0.2rem;
        }
        .psearch {
          grid-template-columns: 1fr 1fr;
        }
        .psearch .find {
          padding: 0.3rem 0.5rem 0.3rem 0.3rem;
          font-size: 0.68rem;
        }
        .psearch-ico {
          width: 1.7rem;
          height: 1.7rem;
        }
        /* スマホは幅が足りないので「ベースを検索」「キャラを検索」と短くする */
        .psearch-mid {
          display: none;
        }
      }

      /* 背の低いスマホ: 上の比較と履歴を詰めて、プロンプト欄に高さを残す */
      @media (max-width: 560px) and (max-height: 720px) {
        .play {
          gap: 8px;
          padding-top: 8px;
        }
        .panel {
          padding: 0.6rem 0.7rem 0.7rem;
        }
        .stage {
          gap: 0.45rem;
        }
        .compare-label {
          flex-wrap: nowrap;
        }
        .stage-foot {
          padding-top: 0.45rem;
        }
        .shots {
          min-height: 2.6rem;
          padding-block: 0.2rem;
        }
        .shot {
          width: 2.5rem;
          height: 2.5rem;
        }
        .shots:empty::before {
          content: "履歴";
          padding: 0 0.6rem;
          font-size: 0.62rem;
        }
        .submit-box .key,
        .compose-foot .key {
          min-height: 2.6rem;
          font-size: 0.85rem;
        }
        .compose,
        .compose.is-chips-open {
          gap: 0.4rem;
        }
        .compose .panel-head h2 {
          font-size: 0.85rem;
        }
        .seg button {
          padding: 0.2rem 0.6rem;
        }
        .ptab,
        .ptab-add {
          padding: 0.2rem 0.6rem;
        }
        .compose > .prompt-box .tokens {
          min-height: 3.6rem;
        }
        .psearch .find {
          padding: 0.25rem 0.5rem 0.25rem 0.25rem;
        }
      }

      /* ---------- スマホ: アプリのような画面にする ----------
         上: 比較（カードの枠を外して画像を大きく）と履歴・提出
         下: プロンプトは画面の下に貼り付くシート（角丸の白い面） */
      @media (max-width: 560px) {
        body {
          background-color: #fff;
          background-image: none;
        }
        .bar {
          background: #fff;
          border-bottom: 1px solid var(--line);
        }
        /* プレイヤーはアバターだけ（状態は輪と印で分かる）。提出人数を左に出す */
        .hud-sum {
          display: grid !important;
          justify-items: start;
          font-size: 0.62rem;
        }
        .hud-sum .eyebrow {
          font-size: 0.5rem;
        }
        .hud-sum b {
          font-size: 0.95rem;
        }
        .roster {
          flex: 1;
          justify-content: space-between;
          padding: 0.15rem 0.3rem;
          border: 0;
          background: var(--ground);
        }
        .roster .m-meta {
          display: none !important;
        }
        .roster .member {
          width: auto !important;
          padding: 0.15rem !important;
          background: none;
        }
        .roster .member.is-me .m-avatar {
          box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--pink);
        }
        .time-track {
          height: 4px;
        }

        .play {
          padding: 10px 14px 0;
          gap: 10px;
          background: #fff;
        }
        /* 比較: 枠を外して、画面いっぱいに使う */
        .stage {
          padding: 0;
          border: 0;
          border-radius: 0;
          box-shadow: none;
          background: none;
          gap: 0.55rem;
        }
        .stage > .panel-head {
          display: none;
        }
        .compare {
          grid-template-columns: repeat(2, min(calc(50% - 5px), calc(25svh * 832 / 1216)));
        }
        .frame {
          border-width: 1.5px;
          border-radius: 14px;
          box-shadow: 0 8px 20px -14px rgb(11 27 43 / 0.5);
        }
        .compare-label {
          font-size: 0.7rem;
        }
        .empty-sub {
          display: none;
        }
        .stage-empty {
          font-size: 0.68rem;
        }
        .stage-empty svg {
          width: 34%;
        }
        .stage-foot {
          padding-top: 0;
          border-top: 0;
        }
        .shots {
          min-height: 2.9rem;
        }
        .shots:empty::before {
          content: "履歴";
          padding: 0 0.9rem;
          font-size: 0.66rem;
        }
        .submit-box .key {
          min-height: 2.75rem;
          padding: 0 1.1rem;
          font-size: 0.86rem;
        }

        /* プロンプト: 画面の下に貼り付くシート */
        .compose {
          margin: 0 -14px;
          padding: 0.85rem 14px calc(0.8rem + env(safe-area-inset-bottom));
          border: 0;
          border-radius: 24px 24px 0 0;
          background: #fff;
          box-shadow:
            0 -1px 0 var(--line),
            0 -14px 32px -20px rgb(11 27 43 / 0.45);
        }
        /* シートのつまみ（押す・スワイプで畳む／開く） */
        .grip {
          position: absolute;
          z-index: 3;
          top: 0;
          left: 50%;
          display: grid;
          place-items: center;
          width: 5rem;
          height: 1.1rem;
          padding: 0;
          border: 0;
          background: none;
          cursor: pointer;
          touch-action: none;
          translate: -50% 0;
        }
        .grip i {
          width: 2.4rem;
          height: 4px;
          border-radius: 999px;
          background: var(--line);
          transition: background 0.2s;
        }
        .grip:active i {
          background: var(--muted);
        }
        /* 畳んだとき: 「プロンプト n語 ⌃」と生成ボタンだけ。空いた高さは画像に回す */
        .play:has(.compose.is-collapsed) {
          grid-template-rows: minmax(0, 1fr) auto;
        }
        .play:has(.compose.is-collapsed) .stage {
          grid-template-rows: auto auto;
          align-content: center;
          gap: 0.9rem;
        }
        .play:has(.compose.is-collapsed) .compare {
          grid-template-columns: repeat(2, min(calc(50% - 5px), calc(46svh * 832 / 1216)));
        }
        .compose.is-collapsed {
          grid-template-rows: auto auto;
          grid-template-areas:
            "peek"
            "foot";
          gap: 0.55rem;
          padding-top: 1.1rem;
        }
        .compose.is-collapsed > :not(.grip, .sheet-peek, .compose-foot) {
          display: none !important;
        }
        .compose.is-collapsed > .sheet-peek {
          grid-area: peek;
          display: flex;
        }
        .sheet-peek {
          align-items: center;
          gap: 0.4rem;
          padding: 0.55rem 0.9rem;
          border: 0;
          border-radius: 999px;
          background: var(--ground);
          font: inherit;
          font-size: 0.8rem;
          font-weight: 700;
          color: var(--ink);
          text-align: left;
          cursor: pointer;
        }
        .sheet-peek span {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .sheet-peek svg {
          flex: none;
          color: var(--muted);
        }
        .compose.is-sheet-anim {
          transition: none;
          animation: sheet-pop 0.3s var(--ease-out);
        }
        @keyframes sheet-pop {
          from {
            transform: translateY(14px);
          }
        }
        .compose .panel-head h2 {
          font-size: 0.95rem;
        }
        .compose > .ptabs {
          margin-top: -0.15rem;
        }
        .compose > .prompt-box {
          border-radius: 16px;
          background: var(--ground);
          border-color: transparent;
        }
        .compose > .prompt-box:focus-within {
          background: #fff;
        }
        .compose > .prompt-box .tokens {
          min-height: 4.2rem;
          gap: 0.3rem;
        }
        .tok {
          padding: 0.15rem 0.15rem 0.15rem 0.65rem;
          background: #fff;
          font-size: 0.78rem;
        }
        .tok .tok-ws button {
          width: 1.2rem;
          height: 0.85rem;
        }
        .prompt-tools {
          padding-top: 0;
        }
        .phase {
          border-radius: 24px 24px 0 0;
          inset: 0;
        }
      }

      /* 背の低いスマホ: 画像をさらに小さくしてプロンプト欄の高さを残す */
      @media (max-width: 560px) and (max-height: 720px) {
        .compare {
          grid-template-columns: repeat(2, min(calc(50% - 5px), calc(19svh * 832 / 1216)));
        }
        .compose > .prompt-box .tokens {
          min-height: 3.2rem;
        }
        /* 見出しは隠し、文章／タグの切り替えはタブの行の右に重ねる */
        .compose .panel-head {
          position: absolute;
          top: 0.1rem;
          right: 14px;
          z-index: 2;
        }
        .compose .panel-title {
          display: none;
        }
        /* 切り替えはアイコンだけにして幅を詰め、タブの行の右端にその分の余白を取る */
        .compose .seg button {
          gap: 0;
          padding: 0.38rem 0.7rem;
          font-size: 0;
        }
        .compose .seg button svg {
          width: 14px;
          height: 14px;
        }
        .compose > .ptabs {
          padding-right: 5.6rem;
        }
      }

      .grip,
      .sheet-peek {
        display: none;
      }

      @media (max-width: 560px) {
        .grip {
          display: grid;
        }
      }

      @media (hover: none) {
        .kbd,
        .key-gen .kbd {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .kickoff,
        .scan-beam {
          display: none;
        }
      }

      /* ---------- スマホの横向き: 背が低いので、PCと同じ「左にプロンプト、右に比較」を詰めて1画面に収める ----------
         上部は1行（ロゴ・残り時間・プレイヤー）、比較の見出しは隠して画像に高さを回す */
      @media (orientation: landscape) and (max-height: 500px) {
        :root {
          --bar-h: calc(3.4rem + env(safe-area-inset-top));
          --track-h: 5px;
          --side: max(12px, env(safe-area-inset-left), env(safe-area-inset-right));
        }
        .bar {
          grid-template-columns: auto auto minmax(0, 1fr);
          grid-template-rows: none;
          grid-template-areas: "left timer hud";
          gap: 0.75rem;
          padding: env(safe-area-inset-top) var(--side) 0;
        }
        .bar-left img {
          width: 4.8rem;
          margin: 0;
        }
        .bar-left .chip {
          display: none;
        }
        .timer {
          grid-auto-flow: column;
          align-items: center;
          gap: 0.5rem;
          width: auto;
          padding: 0.3rem 0.85rem;
          border-radius: 999px;
          box-shadow: none;
        }
        .timer .eyebrow {
          font-size: 0.5rem;
        }
        .timer-num {
          font-size: 1.3rem;
        }
        .hud {
          justify-self: end;
        }
        .roster {
          padding: 0.2rem;
          box-shadow: none;
        }
        .member {
          gap: 0.35rem;
          width: 6.4rem;
          padding: 0.15rem 0.5rem 0.15rem 0.15rem;
        }
        .roster.is-narrow .member {
          width: 4.9rem;
        }
        .m-avatar {
          width: 1.7rem;
          height: 1.7rem;
          font-size: 0.72rem;
        }
        .time-track {
          margin: 0 var(--side);
        }

        .play {
          height: calc(100svh - var(--bar-h) - var(--track-h));
          padding: 8px var(--side) max(8px, env(safe-area-inset-bottom));
          grid-template-columns: minmax(17rem, 40%) minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr);
          grid-template-areas: "compose stage";
          gap: 8px;
        }
        .panel {
          padding: 0.6rem 0.7rem 0.7rem;
          border-radius: 1.1rem;
        }

        /* 左: 見出しの文字は隠し、文章／タグの切り替えをタブの行の右に寄せる */
        .compose,
        .compose.is-chips-open {
          grid-template-columns: minmax(0, 1fr) auto;
          grid-template-rows: auto minmax(0, 1fr) auto auto;
          grid-template-areas:
            "tabs head"
            "prompt prompt"
            "search search"
            "foot foot";
          gap: 0.45rem;
        }
        .compose .panel-title {
          display: none;
        }
        .seg button {
          padding: 0.28rem 0.65rem;
          font-size: 0.72rem;
        }
        .seg button svg {
          display: none;
        }
        .ptab,
        .ptab-add {
          padding: 0.2rem 0.55rem;
          font-size: 0.7rem;
        }
        .compose > .prompt-box .tokens {
          min-height: 0;
          padding: 0.45rem 0.6rem 0.2rem;
        }
        .psearch {
          grid-template-columns: 1fr 1fr;
          gap: 0.4rem;
        }
        .psearch .find {
          padding: 0.25rem 0.5rem 0.25rem 0.25rem;
          font-size: 0.68rem;
        }
        .psearch-ico {
          width: 1.5rem;
          height: 1.5rem;
        }
        .psearch-mid {
          display: none;
        }
        .compose-foot {
          grid-template-columns: auto minmax(0, 1fr);
          gap: 0.6rem;
        }
        .meter .eyebrow,
        .pips {
          display: none;
        }
        .key {
          min-height: 2.6rem;
          font-size: 0.92rem;
        }
        .key-gen .kbd {
          display: none;
        }

        /* 右: お題とあなたの画像を並べ、履歴と提出は右の細い列に */
        .stage {
          grid-template-columns: minmax(0, 1fr) clamp(7.5rem, 18vw, 10rem);
          grid-template-rows: minmax(0, 1fr);
          grid-template-areas: "compare rail";
          column-gap: 0.8rem;
          min-width: 0;
        }
        .stage > .panel-head {
          display: none;
        }
        .compare {
          grid-area: compare;
          container-type: size;
          gap: 0.8rem;
        }
        .compare-item {
          gap: 0.35rem;
          width: min(100%, calc((100cqh - 1.6rem) * 832 / 1216));
        }
        .compare-label {
          font-size: 0.7rem;
        }
        .compare-label small {
          display: none;
        }
        .empty-sub,
        .stage-empty .kbd {
          display: none;
        }
        .stage-empty {
          gap: 0.4rem;
          padding: 0.5rem;
          font-size: 0.64rem;
          line-height: 1.5;
        }
        .stage-empty svg {
          width: 34%;
        }
        .frame {
          border-radius: 0.9rem;
        }
        .stage-foot {
          grid-area: rail;
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) auto;
          align-items: stretch;
          gap: 0.5rem;
          padding: 0 0 0 0.8rem;
          border-top: 0;
          border-left: 2px dashed var(--line);
        }
        .history {
          grid-template-rows: auto minmax(0, 1fr);
          min-height: 0;
        }
        .history-title {
          font-size: 0.78rem;
        }
        .shots {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          align-content: start;
          gap: 0.35rem;
          min-height: 0;
          padding: 0.2rem 0.1rem;
          overflow-x: hidden;
          overflow-y: auto;
        }
        .shots:empty::before {
          grid-column: 1 / -1;
          width: auto;
          max-width: none;
          height: 100%;
          padding: 0 0.5rem;
          text-align: center;
          line-height: 1.5;
          font-size: 0.66rem;
        }
        .shot {
          width: 100%;
          height: auto;
          aspect-ratio: 832 / 1216;
          border-radius: 0.5rem;
        }
        .submit-box {
          justify-items: stretch;
          gap: 0.35rem;
        }
        .submit-box .quick {
          justify-self: start;
          gap: 0.35rem;
          font-size: 0.62rem;
          line-height: 1.3;
          white-space: normal;
        }
        .submit-box .key {
          width: 100%;
          min-width: 0;
          min-height: 2.6rem;
          padding: 0 0.6rem;
          font-size: 0.8rem;
          letter-spacing: 0.02em;
        }
        .submit-box .key svg {
          display: none;
        }

        /* 検索のモーダル: 見出し・検索欄・閉じるを1行にし、決定は見出しの行に。カードの一覧に高さを回す */
        dialog.dialog.search-dialog {
          width: 100%;
          height: 100%;
          max-height: 100svh;
          margin: 0;
          aspect-ratio: auto;
          border-radius: 0;
        }
        .sd {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto minmax(0, 1fr) auto;
          grid-template-areas:
            "head"
            "nav"
            "main"
            "foot";
          border-radius: 0;
          padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
        }
        .sd-head {
          flex-wrap: nowrap;
          padding: 0.45rem 1rem;
        }
        .sd-head h1 {
          font-size: 0.95rem;
          white-space: nowrap;
        }
        .search-field {
          order: 0;
          flex: 1 1 auto;
          max-width: none;
        }
        .sd-nav {
          padding: 0.4rem 1rem;
        }
        .sd-nav button {
          padding: 0.3rem 0.7rem;
          font-size: 0.72rem;
        }
        .sd-main {
          padding: 0.5rem 1rem 0;
        }
        .sd-grid {
          grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
          gap: 0.5rem;
        }
        .sd-foot {
          padding: 0.4rem 1rem calc(0.4rem + env(safe-area-inset-bottom));
        }
        .sd-foot > span:first-child {
          display: none;
        }
        .sd-done.pill {
          padding: 0.4rem 1.4rem;
          font-size: 0.85rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="hurry-edge" aria-hidden="true"></div>
    <header class="bar">
      <div class="bar-left">
        <img src="images/animic-logo.svg" alt="Animic" width="2078" height="607" />
        <span class="chip">ルーム <code id="room-code"></code></span>
        <span class="chip chip-level" id="level-chip"></span>
      </div>
      <div class="timer" id="timer" role="timer" aria-live="off">
        <span class="timer-label eyebrow" id="timer-label">TIME LEFT</span>
        <span class="timer-num" id="timer-num">1:30</span>
      </div>
      <!-- 右上: 全プレイヤーの様子 -->
      <div class="hud" aria-label="プレイヤーの様子">
        <p class="hud-sum" id="hud-sum"></p>
        <ol class="roster" id="roster"></ol>
      </div>
    </header>
    <div class="time-track" aria-hidden="true"><span id="time-bar"></span></div>

    <main class="play">
      <!-- 左: プロンプト入力。下に「生成する」 -->
      <section class="panel compose" aria-labelledby="prompt-title" data-enter>
        <!-- スマホ: つまみを押す・上下にスワイプすると、シートを畳む／開く -->
        <button class="grip" type="button" id="grip" aria-controls="prompt-box" aria-expanded="true" aria-label="プロンプト欄を畳む"><i aria-hidden="true"></i></button>
        <button class="sheet-peek" type="button" id="sheet-peek" hidden>
          <span id="peek-text">プロンプト 0語</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6" /></svg>
        </button>
        <div class="panel-head">
          <div class="panel-title">
            <span class="eyebrow">01 — Prompt</span>
            <h2 id="prompt-title">プロンプト</h2>
          </div>
          <div class="seg" id="seg" role="group" aria-label="入力方法">
            <button type="button" id="mode-text" aria-pressed="true" title="日本語の文章で書く">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg>文章
            </button>
            <button type="button" id="mode-tag" aria-pressed="false" title="英語のタグ（Danbooru 形式）で書く">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 3 7 21M17 3l-2 18M3.5 8.5h17M2.5 15.5h17" /></svg>タグ
            </button>
          </div>
        </div>
        <!-- ベース（背景・画風など全体）とキャラごとのプロンプトを切り替える。2キャラのお題ではキャラ2を足せる -->
        <div class="ptabs" id="ptabs" role="tablist" aria-label="プロンプトの種類"></div>
        <!-- プロンプト欄: 語句ごとに楕円で囲み、右の −／＋ で重み。最後に書いて「、」で区切ると語句になる -->
        <div class="prompt-box" id="prompt-box">
          <div class="tokens" id="tokens">
            <input class="tok-input" id="prompt" type="text" autocomplete="off" enterkeyhint="done" aria-label="プロンプト" aria-controls="suggest" />
          </div>
          <div class="prompt-tools">
            <span class="prompt-len" id="prompt-len">0語</span>
            <button class="clear" type="button" id="clear" aria-label="このプロンプトを空にする" title="このプロンプトを空にする" disabled>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <!-- 入力候補: 書いている言葉に合う表現を、プロンプト欄の下に浮かべて出す -->
          <div class="suggest" id="suggest" role="listbox" aria-label="入力候補" hidden></div>
        </div>
        <!-- 表現の一覧をモーダルで開く -->
        <div class="psearch">
          <!-- ベース: 背景・構図（景色の額縁のアイコン、緑） / キャラ: 人物（人のアイコン、黄色） -->
          <button class="find psearch-btn is-base" type="button" id="search-base" aria-haspopup="dialog">
            <span class="psearch-ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3" /><circle cx="9" cy="10" r="1.8" fill="currentColor" /><path d="m3.5 18 5.5-5.5 4 4 2.5-2.5 5 5" /></svg></span>
            <span class="psearch-text"><b>ベース</b><span class="psearch-mid">プロンプト</span>を検索</span>
          </button>
          <button class="find psearch-btn is-char" type="button" id="search-char" aria-haspopup="dialog">
            <span class="psearch-ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="4" /><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6" /></svg></span>
            <span class="psearch-text"><b>キャラ</b><span class="psearch-mid">プロンプト</span>を検索</span>
          </button>
        </div>
        <div class="chips" id="chips" role="group" aria-label="よく使う表現"></div>
        <div class="phase" id="phase" role="status" hidden></div>
        <div class="compose-foot">
          <div class="meter">
            <span class="eyebrow">Generations</span>
            <span class="pips" id="pips" aria-hidden="true"></span>
            <span class="count">生成 <b id="gen-count">0</b><span id="gen-limit"></span> 回</span>
          </div>
          <button class="key key-gen" type="button" id="generate">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 2.2 6.2L20.5 10l-6.3 2.1L12 18.5l-2.2-6.4L3.5 10l6.3-1.8z" /><path d="M19 15.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z" /></svg>
            生成する
            <span class="kbd" aria-hidden="true"><kbd class="mod-key">⌘</kbd><kbd>↵</kbd></span>
          </button>
        </div>
      </section>

      <!-- 右: 選んでいる画像（左）とお題（右）を並べて比べる。下に履歴と提出 -->
      <section class="panel stage" aria-labelledby="stage-title" data-enter>
        <div class="panel-head">
          <div class="panel-title">
            <span class="eyebrow">02 — Compare</span>
            <h2 id="stage-title">お題とあなたの画像</h2>
          </div>
          <span class="hint" id="submit-hint">画像を1枚選んでください</span>
        </div>
        <div class="compare">
          <div class="compare-item mine">
            <div class="frame" id="stage-view"></div>
            <p class="compare-label" id="mine-label">あなたの画像</p>
          </div>
          <div class="compare-item theme">
            <figure class="frame" id="topic-img"></figure>
            <p class="compare-label">お題<span class="lv-badge" id="lv-badge"></span><small id="topic-rule"></small></p>
          </div>
        </div>
        <div class="stage-foot">
          <!-- 履歴: 生成した順（新しいものが左）。クリックで上の画像を切り替える -->
          <div class="history" aria-labelledby="shots-title">
            <h3 class="history-title" id="shots-title">履歴 <span class="eyebrow">History</span></h3>
            <ol class="shots" id="shots"></ol>
          </div>
          <div class="submit-box">
            <!-- オンにすると、確認のモーダルを出さずにすぐ提出する -->
            <label class="quick" title="オンにすると、確認を出さずにすぐ提出します">
              <input type="checkbox" id="quick-submit" role="switch" />
              <span class="quick-track" aria-hidden="true"></span>
              確認なしですぐ提出
            </label>
            <button class="key key-submit" type="button" id="submit" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
              この1枚で提出
            </button>
          </div>
        </div>
      </section>
    </main>

    <dialog class="dialog" id="confirm">
      <form class="card" method="dialog">
        <h1>提出してもよろしいですか？</h1>

        </label>

    <!-- プロンプトを検索: 日本語・タグのどちらでも検索して、押すとプロンプトに足す（もう一度押すと外す） -->
    <dialog class="dialog search-dialog" id="search" aria-labelledby="search-title">
      <div class="sd">
        <header class="sd-head">
          <h1 id="search-title">プロンプトを検索</h1>
          <label class="search-field">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 5 5" /></svg>
            <input type="search" id="search-q" placeholder="日本語・タグで検索（例：ツインテール、smile）" autocomplete="off" aria-label="プロンプトを検索" />

    <dialog class="dialog topic-zoom" id="topic-zoom" aria-labelledby="topic-zoom-title">

    <div class="overlay" id="overlay" role="status" hidden>

      <div class="overlay-body" id="overlay-body"></div>
    </div>

    <script src="common.js"></script>
    <script src="art.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const q = params();
      const level = q.get("level") || "かんたん";
      const total = Math.max(10, Number(q.get("time")) || 90);
      const GRACE = 15; // 生成終了後に画像を選べる時間
      const LIMIT = Math.max(0, Number(q.get("limit")) || 0); // 生成できる回数の上限（0は無制限。ロビーで設定）
      const code = isValidCode(q.get("code") || "") ? q.get("code") : randomCode();
      // 参加者: ロビーから全員の名前（players）と自分の席（seat）を受け取る。直接開いたときはサンプルの4人
      const myName = q.get("name") || "ゲスト";
      let names = null;
      try {
        names = JSON.parse(q.get("players") || "null");
      } catch {}
      let seat = Number(q.get("seat")) || 0;
      if (!Array.isArray(names) || names.length < 2) {
        names = q.get("opp") ? [myName, q.get("opp")] : [myName, "ぴよ丸", "ぴくせる侍", "プロンプト職人"];
        seat = 0;
      }
      names = names.slice(0, 8).map(String);
      seat = Math.min(Math.max(0, seat), names.length - 1);
      // アバターの色（ロビーと同じ並び）
      const COLORS = [
        ["#ff2d87", "#fff"],
        ["#00b4fc", "#fff"],
        ["#fddb13", "#0b1b2b"],
        ["#ff72b9", "#fff"],
        ["#6fd3ff", "#0b1b2b"],
        ["#ffe98a", "#0b1b2b"],
        ["#5b6573", "#fff"],
      ];
      const players = names.map((name, i) => ({ name: i === seat ? myName : name, isMe: i === seat, bg: COLORS[i % COLORS.length][0], fg: COLORS[i % COLORS.length][1], gens: 0, working: false, submitted: null }));
      const me = players[seat];
      const others = players.filter((p) => !p.isMe);

        { key: "quality", label: "品質", base: true, extra: T([["傑作", "masterpiece"], ["高画質", "best quality"], ["高解像度", "highres"], ["非常に美しい", "very aesthetic"], ["細部まで描き込み", "highly detailed"], ["最新", "newest"]]) },
        { key: "light", label: "光・効果", base: true, extra: T([["逆光", "backlighting"], ["日差し", "sunlight"], ["木漏れ日", "dappled sunlight"], ["ネオン", "neon lights"], ["リムライト", "rim lighting"], ["被写界深度", "depth of field"], ["ボケ", "bokeh"], ["レンズフレア", "lens flare"], ["きらきら", "sparkle"], ["光の粒", "light particles"], ["花びら", "petals"], ["色収差", "chromatic aberration"]]) },
        { key: "color", label: "色調", base: true, extra: T([["モノクロ", "monochrome"], ["グレースケール", "greyscale"], ["パステルカラー", "pastel colors"], ["カラフル", "colorful"], ["淡い色", "muted color"], ["ハイコントラスト", "high contrast"], ["セピア", "sepia"], ["暖色", "warm colors"], ["寒色", "cool colors"]]) },
        { key: "season", label: "季節・行事", base: true, extra: T([["春", "spring (season)"], ["夏", "summer"], ["秋", "autumn"], ["冬", "winter"], ["紅葉", "autumn leaves"], ["クリスマス", "christmas"], ["ハロウィン", "halloween"], ["お正月", "new year"], ["バレンタイン", "valentine"], ["夏祭り", "summer festival"], ["花火", "fireworks"]]) },
      ];
      // 生成画像のモックで扱う特徴（ART_FEATURES）を先頭に置き、タグが同じものは1つにまとめる
      const DICT = (() => {
        const seen = new Set();
        return DICT_GROUPS.flatMap((g) => [...(ART_FEATURES[g.key] || []).map((o) => ({ ja: o.label, tag: o.tag, g })), ...(g.extra || []).map(([ja, tag]) => ({ ja, tag, g }))]).filter((e) => {
          const k = e.tag.toLowerCase();
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });
      })();
      const BASE_KEYS = DICT_GROUPS.filter((g) => g.base).map((g) => g.key);
      // カタカナはひらがなにそろえて、ゆるく探す
      const norm = (v) => v.toLowerCase().replace(/[\u30a1-\u30f6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/\s+/g, " ").trim();

      const GROUPS = [
        ["髪の色", "hair"],
        ["髪型", "style"],
        ["目", "eyes"],
        ["服", "outfit"],
        ["表情", "face"],
        ["背景", "bg"],
      ];
      const TIP = `<p class="tip"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 18h6v1.5a2.5 2.5 0 0 1-2.5 2.5h-1A2.5 2.5 0 0 1 9 19.5zM12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2" /></svg><span><b>コツ</b>　お題を<b>髪・目・服・表情・背景</b>に分けて、ひとつずつ言葉にしてみよう。</span></p>`;
      let mode = "text";
      const sep = () => (mode === "tag" ? ", " : "、");
      const splitParts = (value) =>
        value
          .split(/\s*[、,，]\s*/)
          .map((v) => v.trim())
          .filter(Boolean);

      // プロンプトは「ベース」（背景・画風など全体）と「キャラ」（1人ずつ）に分ける。2キャラのお題ではキャラ2を足せる
      // 中身は語句の並び { t: 語句, w: 重み }。生成に使うときは (語句:1.2) の形にする

      const CHAR_COLORS = ["#f5c400", "var(--cyan)"]; // キャラ1は黄色、キャラ2は水色（ベースは緑）
      const blocks = [{ tokens: [] }, { tokens: [] }]; // 0: ベース, 1〜: キャラ
      let active = 1;
      const blockLabel = (i) => (i === 0 ? "ベース" : MAX_CHARS > 1 ? `キャラ${i}` : "キャラ");
      const PLACEHOLDER = {
        text: ["「、」で区切って入力（例：白背景、アニメ塗り）", "「、」で区切って入力（例：ピンクの髪、ツインテール、笑顔）", "「、」で区切って入力（例：銀髪、ロングヘア、赤い目）"],
        tag: ["「,」で区切って入力（例：white background, anime coloring）", "「,」で区切って入力（例：pink hair, twintails, smile）", "「,」で区切って入力（例：silver hair, long hair, red eyes）"],
      };
      // 背景の表現はベースへ、それ以外は選んでいるキャラへ入れる
      const targetFor = (key) => (BASE_KEYS.includes(key) ? 0 : active === 0 ? 1 : active);
      const tokenText = (k) => (k.w === 1 ? k.t : `(${k.t}:${k.w.toFixed(1)})`);
      const fullPrompt = () =>
        blocks
          .flatMap((b) => b.tokens)
          .map(tokenText)
          .join(sep());
      const hasToken = (i, word) => blocks[i].tokens.some((k) => k.t.toLowerCase() === word.toLowerCase());
      const locked = () => $("prompt").disabled;

      // 入力欄に書いた分を語句にする（最後の区切りより前だけ。all のときは残りも）
      function commitInput(all = false) {
        const input = $("prompt");
        const v = input.value;
        const lastSep = Math.max(v.lastIndexOf("、"), v.lastIndexOf(","), v.lastIndexOf("，"));
        const done = all ? v : lastSep >= 0 ? v.slice(0, lastSep) : "";
        const rest = all ? "" : lastSep >= 0 ? v.slice(lastSep + 1) : v;
        const words = splitParts(done);
        if (!words.length && input.value === rest) return false;
        for (const w of words) if (!hasToken(active, w)) blocks[active].tokens.push({ t: w, w: 1 });
        input.value = rest.trimStart();
        return words.length > 0;
      }

      function renderTabs() {
        $("ptabs").innerHTML =
          blocks
            .map(
              (b, i) =>

            .join("") +
          (blocks.length - 1 < MAX_CHARS ? `<button type="button" class="ptab-add" id="add-char"${locked() ? " disabled" : ""}>＋ キャラ${blocks.length}</button>` : "");

      function renderTokens() {
        const box = $("tokens");
        const input = $("prompt");
        box.querySelectorAll(".tok").forEach((el) => el.remove());
        const off = locked() ? " disabled" : "";
        const html = blocks[active].tokens
          .map((k, i) => {

            return `<span class="tok${cls}" data-i="${i}"><span class="tok-text" title="押すと書き直せます">${escapeHtml(k.t)}</span>${

        box.classList.toggle("is-tags", mode === "tag");

      // 入力候補: 最後の区切りより後ろの言葉で辞書を引き、プロンプト欄の下に出す
      let hot = 0;
      function renderSuggest() {
        const box = $("suggest");
        const v = $("prompt").value;
        const q = norm(v.split(/[、,，]/).pop() || "");

          box.hidden = true;
          return;

        const hits = DICT.filter((e) => norm(e.ja).includes(q) || norm(e.tag).includes(q))

          .slice(0, 8);

          const i = norm(text).indexOf(q);
