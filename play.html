<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="images/animic-favicon.svg" />
    <title>対戦中 | Animic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@900&family=Zen+Kaku+Gothic+New:wght@500;700&family=Montserrat:ital,wght@1,500;1,800&family=JetBrains+Mono:wght@700&display=swap"
    />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/transition.css" />
    <script>
      // 前の画面から塗りつぶして来た場合、描画前に中身を隠す
      try {
        if (sessionStorage.getItem("animic-wipe")) document.documentElement.classList.add("wipe-pending");
      } catch {}
    </script>
    <link rel="stylesheet" href="css/play.css" />
  </head>
  <body>
    <div class="hurry-edge" aria-hidden="true"></div>
    <header class="bar">
      <div class="bar-left">
        <img src="images/animic-logo.svg" alt="Animic" width="2078" height="607" />
        <span class="chip">ルーム <code id="room-code"></code></span>
        <span class="chip chip-level" id="level-chip"></span>
      </div>
      <div class="timer" id="timer" role="timer" aria-live="off">
        <span class="timer-label eyebrow" id="timer-label">TIME LEFT</span>
        <span class="timer-num" id="timer-num">1:30</span>
      </div>
      <!-- 右上: 全プレイヤーの様子 -->
      <div class="hud" aria-label="プレイヤーの様子">
        <p class="hud-sum" id="hud-sum"></p>
        <ol class="roster" id="roster"></ol>
      </div>
    </header>
    <div class="time-track" aria-hidden="true"><span id="time-bar"></span></div>

    <main class="play">
      <!-- 左: プロンプト入力。下に「生成する」 -->
      <section class="panel compose" aria-labelledby="prompt-title" data-enter>
        <!-- スマホ: つまみを押す・上下にスワイプすると、シートを畳む／開く -->
        <button class="grip" type="button" id="grip" aria-controls="prompt-box" aria-expanded="true" aria-label="プロンプト欄を畳む"><i aria-hidden="true"></i></button>
        <button class="sheet-peek" type="button" id="sheet-peek" hidden>
          <span id="peek-text">プロンプト 0語</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6" /></svg>
        </button>
        <div class="panel-head">
          <div class="panel-title">
            <span class="eyebrow">01 — Prompt</span>
            <h2 id="prompt-title">プロンプト</h2>
          </div>
          <div class="seg" id="seg" role="group" aria-label="入力方法">
            <button type="button" id="mode-text" aria-pressed="true" title="日本語の文章で書く">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg>文章
            </button>
            <button type="button" id="mode-tag" aria-pressed="false" title="英語のタグ（Danbooru 形式）で書く">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 3 7 21M17 3l-2 18M3.5 8.5h17M2.5 15.5h17" /></svg>タグ
            </button>
          </div>
        </div>
        <!-- ベース（背景・画風など全体）とキャラごとのプロンプトを切り替える。2キャラのお題ではキャラ2を足せる -->
        <div class="ptabs" id="ptabs" role="tablist" aria-label="プロンプトの種類"></div>
        <!-- プロンプト欄: 語句ごとに楕円で囲み、右の −／＋ で重み。最後に書いて「、」で区切ると語句になる -->
        <div class="prompt-box" id="prompt-box">
          <div class="tokens" id="tokens">
            <input class="tok-input" id="prompt" type="text" autocomplete="off" enterkeyhint="done" aria-label="プロンプト" aria-controls="suggest" />
          </div>
          <div class="prompt-tools">
            <span class="prompt-len" id="prompt-len">0語</span>
            <button class="clear" type="button" id="clear" aria-label="このプロンプトを空にする" title="このプロンプトを空にする" disabled>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <!-- 入力候補: 書いている言葉に合う表現を、プロンプト欄の下に浮かべて出す -->
          <div class="suggest" id="suggest" role="listbox" aria-label="入力候補" hidden></div>
        </div>
        <!-- 表現の一覧をモーダルで開く -->
        <div class="psearch">
          <!-- 入れる先のタブを選んで開く（一覧は同じ）。ベース: 景色の額縁のアイコン、緑 / キャラ: 人のアイコン、黄色 -->
          <button class="find psearch-btn is-base" type="button" id="search-base" aria-haspopup="dialog">
            <span class="psearch-ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3" /><circle cx="9" cy="10" r="1.8" fill="currentColor" /><path d="m3.5 18 5.5-5.5 4 4 2.5-2.5 5 5" /></svg></span>
            <span class="psearch-text"><b>ベース</b><span class="psearch-mid">プロンプト</span>を検索</span>
          </button>
          <button class="find psearch-btn is-char" type="button" id="search-char" aria-haspopup="dialog">
            <span class="psearch-ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="4" /><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6" /></svg></span>
            <span class="psearch-text"><b>キャラ</b><span class="psearch-mid">プロンプト</span>を検索</span>
          </button>
        </div>
        <div class="chips" id="chips" role="group" aria-label="よく使う表現"></div>
        <div class="phase" id="phase" role="status" hidden></div>
        <div class="compose-foot">
          <div class="meter">
            <span class="eyebrow">Generations</span>
            <span class="pips" id="pips" aria-hidden="true"></span>
            <span class="count">生成 <b id="gen-count">0</b><span id="gen-limit"></span> 回</span>
          </div>
          <button class="key key-gen" type="button" id="generate">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 2.2 6.2L20.5 10l-6.3 2.1L12 18.5l-2.2-6.4L3.5 10l6.3-1.8z" /><path d="M19 15.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z" /></svg>
            生成する
            <span class="kbd" aria-hidden="true"><kbd class="mod-key">⌘</kbd><kbd>↵</kbd></span>
          </button>
        </div>
      </section>

      <!-- 右: 選んでいる画像（左）とお題（右）を並べて比べる。下に履歴と提出 -->
      <section class="panel stage" aria-labelledby="stage-title" data-enter>
        <div class="panel-head">
          <div class="panel-title">
            <span class="eyebrow">02 — Compare</span>
            <h2 id="stage-title">お題とあなたの画像</h2>
          </div>
          <span class="hint" id="submit-hint">画像を1枚選んでください</span>
        </div>
        <div class="compare">
          <div class="compare-item mine">
            <div class="frame" id="stage-view"></div>
            <p class="compare-label" id="mine-label">あなたの画像</p>
          </div>
          <div class="compare-item theme">
            <figure class="frame" id="topic-img"></figure>
            <p class="compare-label">お題<span class="lv-badge" id="lv-badge"></span><small id="topic-rule"></small></p>
          </div>
        </div>
        <div class="stage-foot">
          <!-- 履歴: 生成した順（新しいものが左）。クリックで上の画像を切り替える -->
          <div class="history" aria-labelledby="shots-title">
            <h3 class="history-title" id="shots-title">履歴 <span class="eyebrow">History</span></h3>
            <ol class="shots" id="shots"></ol>
          </div>
          <div class="submit-box">
            <!-- オンにすると、確認のモーダルを出さずにすぐ提出する -->
            <label class="quick" title="オンにすると、確認を出さずにすぐ提出します">
              <input type="checkbox" id="quick-submit" role="switch" />
              <span class="quick-track" aria-hidden="true"></span>
              確認なしですぐ提出
            </label>
            <button class="key key-submit" type="button" id="submit" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
              この1枚で提出
            </button>
          </div>
        </div>
      </section>
    </main>

    <dialog class="dialog" id="confirm">
      <form class="card" method="dialog">
        <h1>提出してもよろしいですか？</h1>
        <div class="confirm-shot" id="confirm-shot"></div>
        <p class="sub">提出したあとは変更できません。</p>
        <label class="quick quick-in-dialog">
          <input type="checkbox" id="quick-submit-2" role="switch" />
          <span class="quick-track" aria-hidden="true"></span>
          次からは確認せずにすぐ提出する
        </label>
        <div class="dialog-actions">
          <button class="pill" value="cancel">選び直す</button>
          <button class="pill pill-pink" value="ok">提出する</button>
        </div>
      </form>
    </dialog>

    <!-- プロンプトを検索: 日本語・タグのどちらでも検索して、押すとプロンプトに足す（もう一度押すと外す） -->
    <dialog class="dialog search-dialog" id="search" aria-labelledby="search-title">
      <div class="sd">
        <header class="sd-head">
          <h1 id="search-title">プロンプトを検索</h1>
          <label class="search-field">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 5 5" /></svg>
            <input type="search" id="search-q" placeholder="日本語・タグで検索（例：ツインテール、smile）" autocomplete="off" aria-label="プロンプトを検索" />
          </label>
          <button class="search-close" type="button" id="search-close" aria-label="閉じる">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <!-- 左: ジャンル -->
        <nav class="sd-nav" id="search-cats" aria-label="ジャンル"></nav>
        <!-- 右: サンプル画像とプロンプトのカード -->
        <div class="sd-main">
          <p class="sd-sub" id="search-sub"></p>
          <div class="sd-grid" id="search-results" aria-live="polite"></div>
        </div>
        <footer class="sd-foot">
          <span>カードを押すと<b id="search-target">キャラ</b>に入り、もう一度押すと外れます</span>
          <span class="sd-picked" id="search-picked"></span>
          <button class="pill pill-pink sd-done" type="button" id="search-done">決定</button>
        </footer>
      </div>
    </dialog>

    <dialog class="dialog topic-zoom" id="topic-zoom" aria-labelledby="topic-zoom-title">
      <form class="card" method="dialog">
        <h1 id="topic-zoom-title">お題</h1>
        <figure class="frame" id="topic-zoom-art"></figure>
        <button class="pill" value="close">閉じる</button>
      </form>
    </dialog>

    <div class="overlay" id="overlay" role="status" hidden>
      <div class="overlay-bands" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="overlay-body" id="overlay-body"></div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/art.js"></script>
    <script src="js/play.js"></script>
    <script src="js/prompt-dict.js"></script>
    <script src="js/prompt.js"></script>
  </body>
</html>
