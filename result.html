<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="images/animic-favicon.svg" />
    <title>結果発表 | Animic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@900&family=Zen+Kaku+Gothic+New:wght@500;700&family=Montserrat:ital,wght@1,500&family=JetBrains+Mono:wght@700&display=swap"
    />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="transition.css" />
    <script>
      // 前の画面から塗りつぶして来た場合、描画前に中身を隠す
      try {
        if (sessionStorage.getItem("animic-wipe")) document.documentElement.classList.add("wipe-pending");
      } catch {}
    </script>
    <style>
      :root {
        --display: "Dela Gothic One", "Zen Maru Gothic", sans-serif;
      }

      .bar {
        position: relative;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem clamp(1rem, 4vw, 3rem);
      }

      .bar img {
        display: block;
        width: 8rem;
        height: auto;
      }

      .chip {
        padding: 0.3rem 0.75rem;
        border-radius: 999px;
        background: #fff;
        border: 2px solid var(--line);
        font-size: 0.8rem;
        font-weight: 700;
      }

      .chip code {
        font-family: var(--mono);
        letter-spacing: 0.1em;
      }

      /* 背景の3色の帯（勝敗の見出しの後ろ） */
      .burst {
        position: absolute;
        inset: 0 0 auto;
        height: 26rem;
        overflow: hidden;
        pointer-events: none;
      }

      .burst span {
        position: absolute;
        top: -20%;
        height: 140%;
        width: 5rem;
        transform: skewX(-18deg);
        opacity: 0.9;
      }

      .result {
        position: relative;
        z-index: 1;
        width: min(100%, 72rem);
        margin: 0 auto;
        padding: 0 16px 3rem;
        display: grid;
        gap: clamp(1.5rem, 4vh, 2.5rem);
      }

      .verdict {
        display: grid;
        justify-items: center;
        gap: 0.4rem;
        text-align: center;
      }

      .verdict .eyebrow {
        margin: 0;
        font-family: var(--latin);
        font-style: italic;
        font-size: 0.8rem;
        letter-spacing: 0.3em;
        color: var(--pink);
      }

      .verdict h1 {
        margin: 0;
        font-family: var(--display);
        font-weight: 400;
        font-size: clamp(3rem, 10vw, 6.5rem);
        line-height: 1.1;
        transform: rotate(-4deg) skewX(-6deg);
        color: var(--ink);
        text-shadow:
          4px 4px 0 #fff,
          8px 8px 0 var(--pink-soft);
      }

      .verdict.is-lose h1 {
        text-shadow:
          4px 4px 0 #fff,
          8px 8px 0 var(--cyan);
      }

      .verdict p {
        margin: 0.6rem 0 0;
        font-weight: 700;
        color: var(--muted);
      }

      /* 対戦の結果ボード */
      .board {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr) minmax(0, 1fr);
        gap: clamp(1rem, 2.5vw, 2rem);
        align-items: center;
      }

      .topic {
        display: grid;
        gap: 0.6rem;
        justify-items: center;
        text-align: center;
      }

      .topic figure {
        position: relative;
        width: 100%;
        margin: 0;
        aspect-ratio: 1;
        border-radius: 1.25rem;
        overflow: hidden;
        border: 2.5px solid var(--ink);
        background: #fff;
        rotate: -2deg;
      }

      .topic svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .topic .tag {
        position: absolute;
        left: 0.7rem;
        top: 0.7rem;
        padding: 0.2rem 0.7rem;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font-family: var(--latin);
        font-style: italic;
        font-size: 0.7rem;
        letter-spacing: 0.2em;
      }

      .topic small {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .vs {
        font-family: var(--display);
        font-size: 1.4rem;
        color: #b5bcc6;
      }

      .player {
        position: relative;
        display: grid;
        gap: 0.9rem;
        padding: clamp(1rem, 2.5vw, 1.4rem);
        background: #fff;
        border: 2.5px solid var(--ink);
        border-radius: 1.5rem;
        box-shadow: 0 6px 0 var(--ink);
      }

      .player.is-winner {
        border-color: var(--pink);
        box-shadow:
          0 6px 0 var(--pink),
          0 0 0 6px rgb(255 45 135 / 0.15);
      }

      .crown {
        position: absolute;
        top: -1.4rem;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.35rem 1rem;
        border-radius: 999px;
        background: var(--yellow);
        border: 2.5px solid var(--ink);
        font-family: var(--display);
        font-size: 0.95rem;
        white-space: nowrap;
        translate: -50% 0;
        rotate: -4deg;
      }

      .who {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .avatar {
        display: grid;
        place-items: center;
        flex: none;
        width: 2.3rem;
        height: 2.3rem;
        border-radius: 50%;
        color: #fff;
        font-family: var(--round);
        font-weight: 900;
      }

      .who b {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .who small {
        margin-left: auto;
        font-size: 0.75rem;
        color: var(--muted);
        white-space: nowrap;
      }

      .shot {
        margin: 0;
        aspect-ratio: 1;
        border-radius: 1rem;
        overflow: hidden;
        background: var(--ground);
      }

      .shot svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .shot.is-missing {
        display: grid;
        place-items: center;
        border: 2px dashed var(--line);
        color: var(--muted);
        font-weight: 700;
      }

      .total {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem;
        padding-bottom: 0.6rem;
        border-bottom: 2px dashed var(--line);
      }

      .total span {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--muted);
      }

      .total b {
        font-family: var(--display);
        font-weight: 400;
        font-size: clamp(2rem, 4vw, 2.8rem);
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .is-winner .total b {
        color: var(--pink);
      }

      .breakdown {
        display: grid;
        gap: 0.55rem;
        margin: 0;
      }

      .breakdown div {
        display: grid;
        grid-template-columns: 4.5rem 1fr auto;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.82rem;
      }

      .breakdown dt {
        font-weight: 700;
      }

      .breakdown dd {
        margin: 0;
        font-family: var(--mono);
        font-size: 0.85rem;
        text-align: right;
        min-width: 3.5rem;
      }

      .meter {
        height: 0.55rem;
        border-radius: 99px;
        background: var(--ground);
        overflow: hidden;
      }

      .meter span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: var(--c);
        transition: width 1s cubic-bezier(0.2, 0.9, 0.3, 1);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.9rem;
      }

      .actions .pill {
        width: auto;
        min-width: 13rem;
      }

      .pill-x {
        border-color: #000;
        background: #000;
        color: #fff;
      }

      .note {
        margin: -0.5rem 0 0;
        text-align: center;
        font-size: 0.78rem;
        color: #9aa3ae;
      }

      @media (max-width: 860px) {
        .board {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
        .topic {
          grid-column: 1 / -1;
          order: -1;
          width: min(100%, 16rem);
          justify-self: center;
        }
        .vs {
          display: none;
        }
      }

      /* スマホだけで使う部品。デスクトップでは今までどおりの並びにする */
      .rank,
      .shot-topic {
        display: none;
      }

      .pair {
        display: contents;
      }

      /* ---------- スマホ: アプリ風の結果画面 ---------- */
      @media (max-width: 560px) {
        body {
          /* 下の固定アクションバーのぶん空ける */
          padding-bottom: calc(10.5rem + env(safe-area-inset-bottom, 0px));
        }

        /* 上のアプリバー */
        .bar {
          position: sticky;
          top: 0;
          min-height: calc(56px + env(safe-area-inset-top, 0px));
          padding: env(safe-area-inset-top, 0px) 16px 0;
          background: rgb(245 246 248 / 0.86);
          -webkit-backdrop-filter: blur(12px);
          backdrop-filter: blur(12px);
          border-bottom: 1px solid rgb(11 27 43 / 0.06);
        }
        .bar img {
          width: 6.2rem;
        }
        .chip {
          padding: 0.35rem 0.7rem;
          font-size: 0.72rem;
        }

        .burst {
          height: 16rem;
          -webkit-mask-image: linear-gradient(#000 55%, transparent);
          mask-image: linear-gradient(#000 55%, transparent);
        }
        .burst span {
          width: 2.6rem;
          opacity: 0.35;
        }

        .result {
          padding: 1.1rem 16px 1.5rem;
          gap: 1.1rem;
        }

        /* 勝敗の見出し */
        .verdict {
          gap: 0.2rem;
        }
        .verdict .eyebrow {
          font-size: 0.7rem;
        }
        .verdict h1 {
          font-size: clamp(2rem, 10.5vw, 3.2rem);
          white-space: nowrap;
          text-shadow:
            3px 3px 0 #fff,
            6px 6px 0 var(--pink-soft);
        }
        .verdict.is-lose h1 {
          text-shadow:
            3px 3px 0 #fff,
            6px 6px 0 var(--cyan);
        }
        .verdict p {
          margin-top: 0.35rem;
          font-size: 0.9rem;
        }

        /* お題は各カードの中で見比べるので、上には条件だけを出す */
        .board {
          display: flex;
          flex-direction: column;
          align-items: stretch;
          gap: 0.9rem;
        }
        .topic {
          order: -2;
          align-self: center;
          width: auto;
        }
        .topic figure {
          display: none;
        }
        .topic small {
          padding: 0.35rem 0.85rem;
          border-radius: 999px;
          background: #fff;
          border: 1px solid var(--line);
          font-size: 0.75rem;
          font-weight: 700;
        }

        /* 1位を先頭に */
        .player.is-winner {
          order: -1;
        }

        /* 結果カード: 見出し行 / お題と提出画像 / 内訳 */
        .player {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 0.75rem;
          padding: 0.9rem;
          border-width: 2px;
          border-radius: 20px;
          box-shadow: 0 4px 0 var(--ink);
        }
        .player.is-winner {
          margin-top: 0.6rem;
          box-shadow:
            0 4px 0 var(--pink),
            0 0 0 5px rgb(255 45 135 / 0.14);
        }
        .player > * {
          grid-column: 1 / -1;
        }
        .player .who {
          grid-column: 1;
          gap: 0.5rem;
          min-width: 0;
        }
        .player .total {
          grid-column: 2;
          grid-row: 1;
        }

        .crown {
          top: -1.05rem;
          left: auto;
          right: 0.9rem;
          padding: 0.25rem 0.75rem;
          border-width: 2px;
          font-size: 0.75rem;
          translate: none;
        }

        .rank {
          display: grid;
          place-items: center;
          flex: none;
          width: 1.9rem;
          height: 1.9rem;
          border-radius: 0.6rem;
          background: var(--ground);
          border: 2px solid var(--ink);
          font-family: var(--display);
          font-size: 0.95rem;
          line-height: 1;
        }
        .is-winner .rank {
          background: var(--yellow);
        }
        .avatar {
          width: 2rem;
          height: 2rem;
          font-size: 0.85rem;
        }
        .who b {
          font-size: 0.95rem;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          overflow-wrap: normal;
        }
        .who small {
          display: none;
        }

        .total {
          display: grid;
          justify-items: end;
          gap: 0.15rem;
          padding: 0;
          border: 0;
        }
        .total span {
          font-size: 0.65rem;
          white-space: nowrap;
        }
        .total b {
          font-size: 1.75rem;
        }
        .is-winner .total b {
          font-size: 2.1rem;
        }

        /* お題と提出画像を横に並べて見比べる */
        .pair {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0.6rem;
        }
        .shot-topic {
          display: block;
          position: relative;
          margin: 0;
          aspect-ratio: 1;
          border-radius: 14px;
          overflow: hidden;
          border: 2px solid var(--line);
          background: #fff;
        }
        .shot-topic svg {
          display: block;
          width: 100%;
          height: 100%;
        }
        .shot-topic figcaption {
          position: absolute;
          left: 0.45rem;
          top: 0.45rem;
          padding: 0.1rem 0.55rem;
          border-radius: 999px;
          background: var(--ink);
          color: #fff;
          font-size: 0.65rem;
          font-weight: 700;
        }
        .shot {
          border-radius: 14px;
        }
        .shot.is-missing {
          font-size: 0.85rem;
        }

        /* 2位以下は画像を小さくして詰める */
        .player:not(.is-winner) .pair {
          grid-template-columns: repeat(2, minmax(0, 7.5rem));
        }

        /* スコアの内訳: 3項目を横に並べる */
        .breakdown {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 0.45rem;
          padding: 0.6rem;
          border-radius: 14px;
          background: var(--ground);
        }
        .breakdown div {
          display: grid;
          grid-template-columns: none;
          gap: 0.3rem;
          font-size: 0.7rem;
        }
        .breakdown dt {
          grid-row: 1;
          color: var(--muted);
        }
        .breakdown dd {
          grid-row: 2;
          min-width: 0;
          text-align: left;
          font-size: 0.95rem;
          white-space: nowrap;
        }
        .breakdown dd small {
          font-family: var(--body);
          font-size: 0.62rem;
          color: var(--muted);
        }
        .breakdown .meter {
          grid-row: 3;
          height: 0.35rem;
          background: #fff;
        }

        /* 下に固定したアクションバー */
        .actions {
          position: fixed;
          z-index: 10;
          left: 0;
          right: 0;
          bottom: 0;
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0.6rem;
          padding: 0.9rem 16px max(12px, env(safe-area-inset-bottom, 0px));
          background: #fff;
          border-radius: 20px 20px 0 0;
          box-shadow: 0 -10px 30px -12px rgb(11 27 43 / 0.28);
        }
        .actions .pill {
          width: 100%;
          min-width: 0;
          min-height: 48px;
          padding: 0.7rem 0.8rem;
          font-size: 0.9rem;
        }
        .actions #rematch {
          grid-column: 1 / -1;
          order: -1;
          min-height: 56px;
          font-size: 1.05rem;
        }

        /* トーストはアクションバーの上に出す */
        .toast {
          bottom: calc(10.5rem + env(safe-area-inset-bottom, 0px));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .meter span {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="burst" aria-hidden="true">
      <span style="left: 6%; background: var(--cyan)"></span>
      <span style="left: 12%; width: 1.2rem; background: var(--yellow)"></span>
      <span style="right: 10%; background: var(--pink-soft)"></span>
      <span style="right: 4%; width: 1.2rem; background: var(--yellow)"></span>
    </div>

    <header class="bar">
      <a href="index.html"><img src="images/animic-logo.svg" alt="Animic トップ" width="2078" height="607" /></a>
      <span class="chip">ルーム <code id="room-code"></code></span>
    </header>

    <main class="result">
      <section class="verdict" id="verdict" data-enter>
        <p class="eyebrow">RESULT</p>
        <h1 id="verdict-title">YOU WIN!</h1>
        <p id="verdict-sub"></p>
      </section>

      <section class="board" aria-label="対戦結果">
        <article class="player" id="card-me" data-enter></article>
        <div class="topic" data-enter>
          <figure id="topic-img"><span class="tag">THEME</span></figure>
          <small id="topic-meta"></small>
          <span class="vs" aria-hidden="true">VS</span>
        </div>
        <article class="player" id="card-them" data-enter></article>
      </section>

      <div class="actions" data-enter>
        <button class="pill pill-pink" type="button" id="rematch">同じメンバーで再戦</button>
        <button class="pill pill-x" type="button" id="share">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z" /></svg>
          結果をシェア
        </button>
        <button class="pill" type="button" id="home">トップへ戻る</button>
      </div>
    </main>

    <script src="common.js"></script>
    <script src="art.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const q = params();
      const code = isValidCode(q.get("code") || "") ? q.get("code") : randomCode();
      const level = q.get("level") || "かんたん";
      const total = Math.max(10, Number(q.get("time")) || 90);
      const role = q.get("role") || "host";

      // 受け取った提出内容（特徴~再現度~残り秒~生成回数、未提出は none）。直接開いた場合はモックの値を使う
      function parse(value, fallback) {
        if (value === "none") return null;
        const [f, sim, remain, gens] = String(value ?? fallback).split("~");
        return { features: artDecode(f), sim: Number(sim), remain: Number(remain), gens: Number(gens) };
      }
      const me = { name: q.get("name") || "ねこぜ", color: "#ff2d87", entry: parse(q.get("me"), "pink.twin.blue.hoodie.smile.white~84.6~41~3") };
      const them = { name: q.get("opp") || "ぴよ丸", color: "#00b4fc", entry: parse(q.get("them"), "pink.bob.blue.sailor.smile.sky~79.2~22~5") };

      // 仮のスコア: 再現度 + 提出速度（最大20） + 生成回数（1回で15、1回増えるごとに-3）
      function score(e) {
        if (!e) return null;
        const speed = Math.round((Math.max(0, e.remain) / total) * 20);
        const gens = Math.max(0, 15 - (Math.max(1, e.gens) - 1) * 3);
        return { sim: e.sim, speed, gens, total: Math.round((e.sim + speed + gens) * 10) / 10 };
      }
      me.score = score(me.entry);
      them.score = score(them.entry);

      let result;
      if (!me.score && !them.score) result = "none";
      else if (!them.score || (me.score && me.score.total > them.score.total)) result = "win";
      else if (!me.score || them.score.total > me.score.total) result = "lose";
      else result = "draw";

      const TITLES = {
        win: ["YOU WIN!", `${them.name} さんに勝ちました！`],
        lose: ["YOU LOSE…", `${them.name} さんの勝ちです。次こそは！`],
        draw: ["DRAW", "最終スコアが同点でした"],
        none: ["NO GAME", "どちらも提出しなかったため、勝負不成立です"],
      };
      $("verdict-title").textContent = TITLES[result][0];
      $("verdict-sub").textContent = TITLES[result][1];
      $("verdict").classList.toggle("is-lose", result === "lose" || result === "none");
      $("room-code").textContent = code;
      $("topic-img").insertAdjacentHTML("afterbegin", artSvg(ART_TOPIC, "お題のイラスト"));
      $("topic-meta").textContent = `お題・${level}・${total}秒`;

      // スマホでは順位とお題の縮小版をカードの中に出す（デスクトップでは隠す）
      const rankOf = (isMe) => (result === "none" ? "—" : result === "draw" ? 1 : (result === "win") === isMe ? 1 : 2);
      const topicMini = artSvg(ART_TOPIC, "お題のイラスト");

      function card(p, isMe, winner) {
        const s = p.score;
        const row = (label, value, max, color, text) =>
          `<div><dt>${label}</dt><span class="meter"><span data-w="${Math.min(100, (value / max) * 100)}" style="--c:${color}"></span></span><dd>${text}</dd></div>`;
        return `${winner ? '<span class="crown"><svg width="20" height="16" viewBox="0 0 24 18" aria-hidden="true"><path d="M2 5l5 4 5-7 5 7 5-4-2 11H4z" fill="#ff2d87" stroke="#0b1b2b" stroke-width="2" stroke-linejoin="round" /></svg>WINNER</span>' : ""}
          <div class="who"><span class="rank" aria-label="${rankOf(isMe)}位">${rankOf(isMe)}</span><span class="avatar" style="background:${p.color}">${escapeHtml([...p.name][0])}</span><b>${escapeHtml(p.name)}</b><small>${isMe ? "あなた" : "対戦相手"}</small></div>
          <div class="pair">
            <figure class="shot-topic">${topicMini}<figcaption>お題</figcaption></figure>
            ${s ? `<figure class="shot">${artSvg(p.entry.features, `${p.name}さんの提出画像`)}</figure>` : `<figure class="shot is-missing">未提出</figure>`}
          </div>
          <div class="total"><span>最終スコア</span><b data-to="${s ? s.total : 0}">${s ? "0.0" : "—"}</b></div>
          ${
            s
              ? `<dl class="breakdown">
            ${row("再現度", s.sim, 100, "var(--pink)", s.sim.toFixed(1))}
            ${row("提出速度", s.speed, 20, "var(--cyan)", `+${s.speed}`)}
            ${row("生成回数", s.gens, 15, "var(--yellow)", `+${s.gens}<small>（${p.entry.gens}回）</small>`)}
          </dl>`
              : `<p class="topic-note" style="margin:0;color:var(--muted);font-size:.85rem">時間内に提出されませんでした</p>`
          }`;
      }
      $("card-me").innerHTML = card(me, true, result === "win");
      $("card-them").innerHTML = card(them, false, result === "lose");
      $("card-me").classList.toggle("is-winner", result === "win");
      $("card-them").classList.toggle("is-winner", result === "lose");

      // スコアのカウントアップと棒グラフ
      async function reveal() {
        await wait(reducedMotion ? 0 : 1100);
        document.querySelectorAll(".meter span").forEach((el) => (el.style.width = `${el.dataset.w}%`));
        document.querySelectorAll(".total b[data-to]").forEach((el) => {
          const to = Number(el.dataset.to);
          if (!to) return;
          const start = performance.now();
          const dur = reducedMotion ? 0 : 1200;
          (function tick(now) {
            // 最初のフレームの時刻が start より前になることがあるので 0 未満にしない
            const t = dur ? Math.min(1, Math.max(0, (now - start) / dur)) : 1;
            el.textContent = (to * (1 - Math.pow(1 - t, 3))).toFixed(1);
            if (t < 1) requestAnimationFrame(tick);
          })(start);
        });
      }
      playWipeOut();
      reveal();

      const lobbyQuery = { code, name: me.name, role };
      $("rematch").addEventListener("click", (e) => wipeTo("lobby.html", lobbyQuery, e.currentTarget));
      $("home").addEventListener("click", (e) => wipeTo("index.html", {}, e.currentTarget));
      $("share").addEventListener("click", () => toast("シェアリンクをコピーしました"));
    </script>
  </body>
</html>
