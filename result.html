<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="images/animic-favicon.svg" />
    <title>結果発表 | Animic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@900&family=Zen+Kaku+Gothic+New:wght@500;700&family=Montserrat:ital,wght@1,500;1,800&family=JetBrains+Mono:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="transition.css" />
    <script>
      // 前の画面から塗りつぶして来た場合、描画前に中身を隠す
      try {
        if (sessionStorage.getItem("animic-wipe")) document.documentElement.classList.add("wipe-pending");
      } catch {}
    </script>
    <style>
      :root {
        --display: "Dela Gothic One", "Zen Maru Gothic", sans-serif;
        --edge: #dfe2e7;
        --lift: 0 12px 32px -20px rgb(11 27 43 / 0.35);
        --ease-pop: cubic-bezier(0.3, 1.6, 0.5, 1);
        --ease-out: cubic-bezier(0.2, 0.9, 0.3, 1);
        --ok: #16b37e;
        --ng: #ff2d87;
      }

      body {
        overflow-x: hidden;
      }

      .eyebrow {
        margin: 0;
        font-family: var(--latin);
        font-style: italic;
        font-weight: 800;
        font-size: 0.62rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      /* ---------- 上部 ---------- */
      .bar {
        position: relative;
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        height: 4.5rem;
        padding: 0 clamp(16px, 3vw, 2rem);
        background: rgb(245 246 248 / 0.92);
        backdrop-filter: blur(8px);
      }

      .bar img {
        display: block;
        width: 7rem;
        height: auto;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.32rem 0.8rem;
        border: 2px solid var(--edge);
        border-radius: 999px;
        background: #fff;
        font-size: 0.78rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .chip code {
        font-family: var(--mono);
        letter-spacing: 0.12em;
      }

      .chip-level {
        border-color: transparent;
        background: rgb(11 27 43 / 0.06);
        color: var(--muted);
      }

      .bar-right {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-left: auto;
      }

      .phase-label {
        display: grid;
        justify-items: end;
        gap: 0.1rem;
        margin-right: 0.4rem;
        line-height: 1;
      }

      .phase-label .eyebrow {
        color: var(--pink);
      }

      .phase-label b {
        font-family: var(--display);
        font-weight: 400;
        font-size: 1.05rem;
      }

      .ctl {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.45rem 0.9rem;
        border: 2px solid var(--edge);
        border-radius: 999px;
        background: #fff;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s,
          color 0.15s;
      }

      .ctl:hover {
        border-color: var(--ink);
      }

      .ctl[aria-pressed="true"] {
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }

      .ctl[hidden] {
        display: none;
      }

      .track {
        height: 6px;
        background: rgb(11 27 43 / 0.06);
      }

      .track i {
        display: block;
        height: 100%;
        background:
          repeating-linear-gradient(-60deg, rgb(255 255 255 / 0.3) 0 6px, transparent 6px 14px) 0 0 / 32px 100%,
          linear-gradient(90deg, var(--cyan), var(--pink));
        transform-origin: left;
        transform: scaleX(0);
        animation: stripes 0.9s linear infinite;
      }

      @keyframes stripes {
        to {
          background-position:
            32px 0,
            0 0;
        }
      }

      /* ---------- 採点ステージ ---------- */
      .stage {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(19rem, 25rem) minmax(0, 1fr);
        align-items: center;
        gap: clamp(1rem, 2.4vw, 2.5rem);
        width: min(100%, 84rem);
        height: calc(100svh - 4.5rem - 6px - 8.5rem);
        min-height: 34rem;
        margin: 0 auto;
        padding: 1.5rem clamp(16px, 3vw, 2rem) 1rem;
      }

      .stage[hidden] {
        display: none;
      }

      .col {
        display: grid;
        justify-items: center;
        gap: 0.7rem;
        min-height: 0;
        height: 100%;
        align-content: center;
      }

      .col-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .col-label .eyebrow {
        color: var(--muted);
      }

      .frame {
        position: relative;
        width: min(100%, calc((100svh - 22rem) * 832 / 1216));
        min-width: 11rem;
        aspect-ratio: 832 / 1216;
        border: 2px solid var(--edge);
        border-radius: 1.3rem;
        background: #fff;
        box-shadow: var(--lift);
        overflow: hidden;
      }

      .frame img,
      .frame svg {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* 提出画像: 入れ替わるときに横から滑り込む */
      .frame.is-in {
        animation: card-in 0.7s var(--ease-out);
      }

      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateX(3rem) rotate(4deg) scale(0.94);
        }
      }

      .missing {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.6rem;
        height: 100%;
        background:
          radial-gradient(circle, rgb(11 27 43 / 0.08) 1.2px, transparent 1.6px) 0 0 / 14px 14px,
          var(--ground);
        font-weight: 700;
        color: var(--muted);
      }

      /* 推論中: 走査線と、画面全体のうっすらしたノイズ */
      .scan {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s;
      }

      .is-infer .scan {
        opacity: 1;
      }

      .scan::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 26%;
        background: linear-gradient(to bottom, transparent, rgb(0 180 252 / 0.22) 80%, rgb(255 255 255 / 0.95));
        mix-blend-mode: screen;
        animation: sweep 1.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }

      .scan::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgb(0 180 252 / 0.12) 1px, transparent 1px) 0 0 / 100% 18px,
          linear-gradient(90deg, rgb(0 180 252 / 0.12) 1px, transparent 1px) 0 0 / 18px 100%;
      }

      @keyframes sweep {
        from {
          top: -26%;
        }
        to {
          top: 100%;
        }
      }

      /* 中央: 解析パネル */
      .panel {
        position: relative;
        display: grid;
        gap: 1rem;
        align-self: center;
        padding: 1.3rem 1.3rem 1.2rem;
        border: 2px solid var(--edge);
        border-radius: 1.6rem;
        background: #fff;
        box-shadow: var(--lift);
        overflow: hidden;
      }

      .who {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .avatar {
        display: grid;
        place-items: center;
        flex: none;
        width: 2.8rem;
        height: 2.8rem;
        border-radius: 50%;
        background: var(--c, var(--pink));
        color: var(--fg, #fff);
        font-family: var(--round);
        font-weight: 900;
        font-size: 1.15rem;
      }

      .who-name {
        display: grid;
        gap: 0.15rem;
        min-width: 0;
      }

      .who-name b {
        overflow: hidden;
        font-family: var(--round);
        font-weight: 900;
        font-size: 1.35rem;
        line-height: 1.15;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .who-name .eyebrow {
        color: var(--muted);
      }

      .me-tag {
        margin-left: 0.3rem;
        padding: 0.05rem 0.45rem;
        border-radius: 999px;
        background: #fff0f7;
        color: var(--pink);
        font-family: var(--body);
        font-size: 0.66rem;
        vertical-align: 0.2em;
      }

      .who-order {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted);
      }

      /* 推論の進み具合 */
      .infer {
        display: grid;
        gap: 0.4rem;
      }

      .infer-row {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted);
      }

      .infer-row b {
        color: var(--ink);
      }

      .infer-row .t {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }

      .infer-bar {
        height: 8px;
        border-radius: 999px;
        background: var(--ground);
        overflow: hidden;
      }

      .infer-bar i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background:
          repeating-linear-gradient(-60deg, rgb(255 255 255 / 0.35) 0 6px, transparent 6px 14px) 0 0 / 32px 100%,
          linear-gradient(90deg, var(--cyan), var(--pink));
        transform-origin: left;
        transform: scaleX(var(--p, 0));
        animation: stripes 0.6s linear infinite;
      }

      .log {
        min-height: 2.4rem;
        margin: 0;
        font-family: var(--mono);
        font-size: 0.66rem;
        line-height: 1.6;
        color: var(--muted);
        white-space: pre-line;
      }

      .log b {
        color: var(--cyan);
        font-weight: 500;
      }

      /* 採点結果 */
      .score {
        display: none;
        gap: 0.7rem;
      }

      .is-done .score {
        display: grid;
        animation: fade-in 0.3s;
      }

      .is-done .infer,
      .is-done .log,
      .is-done .out {
        display: none;
      }

      .score-top {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .score-num {
        display: grid;
        gap: 0.1rem;
      }

      .score-num .eyebrow {
        color: var(--pink);
      }

      .score-num b {
        font-family: var(--display);
        font-weight: 400;
        font-size: clamp(3rem, 5.5vw, 4.4rem);
        line-height: 0.95;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
      }

      .score-num b small {
        margin-left: 0.15rem;
        font-size: 0.32em;
        color: var(--muted);
      }

      .stamp {
        padding: 0.35rem 0.8rem 0.4rem;
        border: 3px solid var(--c, var(--ink));
        border-radius: 0.6rem;
        color: var(--c, var(--ink));
        font-family: var(--display);
        font-size: 1.05rem;
        line-height: 1;
        white-space: nowrap;
        rotate: -8deg;
        opacity: 0;
      }

      .stamp small {
        display: block;
        margin-bottom: 0.15rem;
        font-family: var(--latin);
        font-style: italic;
        font-weight: 800;
        font-size: 0.5rem;
        letter-spacing: 0.2em;
      }

      .stamp.is-on {
        animation: stamp 0.5s var(--ease-pop) forwards;
      }

      @keyframes stamp {
        from {
          opacity: 0;
          scale: 2.4;
        }
        to {
          opacity: 1;
          scale: 1;
        }
      }

      .parts {
        display: grid;
        gap: 0.45rem;
        margin: 0;
      }

      .parts div {
        display: grid;
        grid-template-columns: 4.6rem minmax(0, 1fr) 3.4rem;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.75rem;
      }

      .parts dt {
        font-weight: 700;
        color: var(--muted);
      }

      .parts dd {
        margin: 0;
        font-family: var(--mono);
        font-size: 0.78rem;
        text-align: right;
      }

      .meter {
        height: 8px;
        border-radius: 999px;
        background: var(--ground);
        overflow: hidden;
      }

      .meter i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: var(--c);
        transition: width 1.1s var(--ease-out);
      }

      /* ---------- 推論パイプライン: 6つのモデルを順に動かす ---------- */
      .models {
        display: grid;
        gap: 0.3rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .model {
        display: grid;
        grid-template-columns: 1.4rem minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.55rem;
        padding: 0.4rem 0.6rem;
        border-radius: 0.75rem;
        background: var(--ground);
        color: #9aa3ae;
        transition:
          background 0.3s,
          color 0.3s,
          box-shadow 0.3s;
      }

      .model-ico {
        display: grid;
        place-items: center;
        width: 1.4rem;
        height: 1.4rem;
        border-radius: 50%;
        background: #e6e8ec;
        color: #fff;
      }

      .model-name {
        display: grid;
        min-width: 0;
        line-height: 1.2;
      }

      .model-name b {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 0.74rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .model-name small {
        font-size: 0.62rem;
        font-weight: 700;
      }

      .model-val {
        font-family: var(--mono);
        font-size: 0.74rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .model.is-run {
        background: #fff;
        color: var(--ink);
        box-shadow:
          inset 0 0 0 1.5px var(--cyan),
          0 8px 18px -12px rgb(0 180 252 / 0.8);
      }

      .model.is-run .model-ico {
        background: conic-gradient(var(--cyan) calc(var(--p, 0) * 360deg), #e6e8ec 0);
        -webkit-mask: radial-gradient(circle, transparent 0.35rem, #000 0.36rem);
        mask: radial-gradient(circle, transparent 0.35rem, #000 0.36rem);
      }

      .model.is-done {
        background: #fff;
        color: var(--ink);
        box-shadow: inset 0 0 0 1.5px var(--edge);
      }

      .model.is-done .model-ico {
        background: var(--ink);
        animation: stamp 0.3s var(--ease-pop);
      }

      .model.is-done .model-val {
        color: var(--ink);
        font-weight: 700;
      }

      /* 指標の見出し（キャラクター一致度など）。モデルがそろうと値が出る */
      .model-cat {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-top: 0.3rem;
        padding: 0 0.3rem;
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--muted);
      }

      .model-cat:first-child {
        margin-top: 0;
      }

      .model-cat .cat-val {
        font-family: var(--display);
        font-weight: 400;
        font-size: 0.85rem;
        color: #c9ced6;
      }

      .model-cat.is-done {
        color: var(--ink);
      }

      .model-cat.is-done .cat-val {
        color: var(--pink);
        animation: stamp 0.3s var(--ease-pop);
      }

      .models .model {
        padding-block: 0.22rem;
      }

      .models {
        gap: 0.2rem;
      }

      .panel .out {
        min-height: 0;
        max-height: 8.6rem;
        overflow: hidden;
        mask-image: linear-gradient(to bottom, #000 80%, transparent);
      }

      .panel {
        max-height: 100%;
        gap: 0.75rem;
      }

      /* OpenPose: 骨格 */
      .ov-pose {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 3px rgb(11 27 43 / 0.5));
      }

      /* いま動いているモデルの出力 */
      .out {
        display: grid;
        align-content: start;
        gap: 0.45rem;
        min-height: 7.4rem;
        padding: 0.7rem 0.75rem;
        border-radius: 0.9rem;
        background: var(--ink);
        color: #fff;
        font-family: var(--mono);
        font-size: 0.68rem;
      }

      .out-head {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #9fb0c3;
      }

      .out-head b {
        color: var(--cyan);
        font-weight: 700;
      }

      .out-head span:last-child {
        margin-left: auto;
      }

      .tags {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      .tags > div {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 0.25rem;
      }

      .tags h4 {
        width: 100%;
        margin: 0 0 0.1rem;
        font-family: var(--body);
        font-size: 0.6rem;
        color: #9fb0c3;
      }

      .tg {
        display: inline-flex;
        align-items: baseline;
        gap: 0.25rem;
        padding: 0.1rem 0.4rem;
        border-radius: 0.35rem;
        background: rgb(255 255 255 / 0.08);
        color: #c8d3df;
        font-size: 0.62rem;
      }

      .tg i {
        font-style: normal;
        color: #7f8fa3;
      }

      .tg.is-hit {
        background: rgb(22 179 126 / 0.22);
        color: #7ff0c4;
      }

      @keyframes tg-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }

      .metric {
        display: grid;
        gap: 0.35rem;
      }

      .metric-big {
        font-family: var(--display);
        font-size: 1.9rem;
        line-height: 1;
        color: #fff;
      }

      .metric-big small {
        margin-left: 0.3rem;
        font-family: var(--mono);
        font-size: 0.66rem;
        color: #9fb0c3;
      }

      .vec {
        display: grid;
        grid-template-columns: repeat(32, 1fr);
        gap: 2px;
        height: 1.6rem;
      }

      .vec i {
        border-radius: 1px;
        background: var(--c);
        opacity: var(--o);
      }

      /* 再現度の集計（カテゴリごと） */
      .cats {
        display: grid;
        gap: 0.35rem;
      }

      .cats div {
        display: grid;
        grid-template-columns: 6.6rem minmax(0, 1fr) 2.8rem;
        align-items: center;
        gap: 0.5rem;
        font-family: var(--body);
        font-size: 0.66rem;
        font-weight: 700;
        color: #c8d3df;
      }

      .cats dd {
        margin: 0;
        font-family: var(--mono);
        text-align: right;
        color: #fff;
      }

      .cats .meter {
        height: 6px;
        background: rgb(255 255 255 / 0.1);
      }

      /* 画像の上に重ねる、モデルの出力 */
      .ov {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s;
      }

      .ov.is-on {
        opacity: 1;
      }

      /* DINOv2: パッチごとの特徴の強さ */
      .ov-patch {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        grid-auto-rows: 1fr;
        mix-blend-mode: multiply;
      }

      .ov-patch i {
        background: var(--c);
        opacity: 0;
        transition: opacity 0.4s;
        transition-delay: var(--dl);
      }

      .ov-patch.is-on i {
        opacity: var(--o);
      }

      /* CCIP: 顔の切り出し */
      .ov-face {
        border: 0;
      }

      .ov-face span {
        position: absolute;
        top: 12%;
        left: 24%;
        width: 52%;
        height: 32%;
        border: 2px solid var(--yellow);
        border-radius: 0.6rem;
        box-shadow: 0 0 0 9999px rgb(11 27 43 / 0.45);
      }

      .ov-face b {
        position: absolute;
        left: -2px;
        bottom: calc(100% + 4px);
        padding: 0.1rem 0.45rem;
        border-radius: 0.35rem;
        background: var(--yellow);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 0.6rem;
        white-space: nowrap;
      }

      /* Depth Anything V2: 深度マップ風（近いほど明るい） */
      .is-depth img,
      .is-depth svg {
        filter: grayscale(1) contrast(1.6) brightness(1.05) blur(1.5px);
        transition: filter 0.6s;
      }

      .ov-depth {
        background: linear-gradient(to bottom, rgb(30 0 60 / 0.55), rgb(255 120 40 / 0.35) 55%, rgb(255 230 120 / 0.25));
        mix-blend-mode: color;
      }

      /* SigLIP 2・DreamSim: 画像全体を読み取る光 */
      .ov-glow {
        background: radial-gradient(circle at 50% var(--y, 30%), rgb(0 180 252 / 0.35), transparent 55%);
        mix-blend-mode: screen;
        animation: glow 2s ease-in-out infinite alternate;
      }

      @keyframes glow {
        to {
          --y: 75%;
          background: radial-gradient(circle at 50% 75%, rgb(255 45 135 / 0.3), transparent 55%);
        }
      }

      /* ---------- 下: 全員の順番と結果 ---------- */
      .rail {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: center;
        gap: 0.6rem;
        width: min(100% - 32px, 84rem);
        margin: 0 auto;
        padding: 0.8rem;
        border: 2px solid var(--edge);
        border-radius: 1.4rem;
        background: #fff;
        box-shadow: var(--lift);
        overflow-x: auto;
        scrollbar-width: none;
      }

      .rail[hidden] {
        display: none;
      }

      .seat {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex: 0 0 auto;
        width: 12.5rem;
        padding: 0.45rem 0.8rem 0.45rem 0.45rem;
        border-radius: 999px;
        background: var(--ground);
        transition:
          background 0.3s,
          transform 0.4s var(--ease-pop),
          opacity 0.3s;
      }

      .seat .avatar {
        width: 2.2rem;
        height: 2.2rem;
        font-size: 0.9rem;
      }

      .seat-meta {
        display: grid;
        min-width: 0;
        line-height: 1.2;
      }

      .seat-meta b {
        overflow: hidden;
        font-size: 0.8rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .seat-meta small {
        font-size: 0.66rem;
        font-weight: 700;
        color: var(--muted);
      }

      .seat-score {
        margin-left: auto;
        font-family: var(--display);
        font-size: 1rem;
      }

      .seat.is-wait {
        opacity: 0.55;
      }

      .seat.is-now {
        background: #fff;
        box-shadow: 0 0 0 2px var(--pink), 0 10px 22px -12px rgb(255 45 135 / 0.7);
        transform: translateY(-3px);
      }

      .seat.is-now .avatar {
        box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--pink);
        animation: pulse 1.2s ease-in-out infinite;
      }

      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 3px #fff, 0 0 0 9px rgb(255 45 135 / 0.25);
        }
      }

      .seat.is-scored {
        background: #fff;
        box-shadow: inset 0 0 0 1.5px var(--edge);
      }

      .seat.is-me .seat-meta b::after {
        content: "（あなた）";
        font-weight: 500;
        color: var(--pink);
      }

      .seat-rank {
        position: absolute;
        top: -0.45rem;
        left: 1.6rem;
        display: grid;
        place-items: center;
        min-width: 1.3rem;
        height: 1.3rem;
        padding: 0 0.25rem;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font-family: var(--mono);
        font-size: 0.62rem;
        animation: stamp 0.35s var(--ease-pop);
      }

      /* ---------- 発表前の幕間: 次の人の名前を大きく ---------- */
      .curtain {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        pointer-events: none;
        overflow: hidden;
      }

      .curtain-band {
        position: absolute;
        left: -10%;
        right: -10%;
        top: 50%;
        height: 10rem;
        translate: 0 -50%;
        rotate: -6deg;
        background: linear-gradient(var(--cyan) 0 10px, var(--ink) 10px calc(100% - 10px), var(--pink) calc(100% - 10px));
        animation: band 1.5s cubic-bezier(0.7, 0, 0.3, 1) forwards;
      }

      @keyframes band {
        0% {
          clip-path: inset(0 100% 0 0);
        }
        22%,
        76% {
          clip-path: inset(0 0 0 0);
        }
        100% {
          clip-path: inset(0 0 0 100%);
        }
      }

      .curtain-text {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 0.3rem;
        rotate: -6deg;
        color: #fff;
        animation: text 1.5s var(--ease-out) forwards;
      }

      .curtain-text .eyebrow {
        color: var(--yellow);
      }

      .curtain-text b {
        font-family: var(--display);
        font-weight: 400;
        font-size: clamp(2.2rem, 7vw, 4.2rem);
        line-height: 1;
      }

      @keyframes text {
        0%,
        14% {
          opacity: 0;
          transform: translateX(-30vw) skewX(24deg);
        }
        28% {
          opacity: 1;
          transform: translateX(1.5vw) skewX(-8deg);
        }
        34%,
        66% {
          opacity: 1;
          transform: none;
        }
        78%,
        100% {
          opacity: 0;
          transform: translateX(30vw) skewX(24deg);
        }
      }

      /* ---------- 最終結果: 表彰台 ---------- */
      .final {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 1.6rem;
        width: min(100%, 72rem);
        margin: 0 auto;
        padding: 1.8rem 16px 3rem;
        padding-top: 1.8rem;
      }

      .final[hidden] {
        display: none;
      }

      .burst {
        position: absolute;
        inset: 0 0 auto;
        height: 17rem;
        opacity: 0.9;
        overflow: hidden;
        pointer-events: none;
        z-index: -1;
      }

      .burst span {
        position: absolute;
        top: -20%;
        height: 140%;
        transform: skewX(-18deg);
        animation: burst-in 0.9s var(--ease-out) both;
      }

      @keyframes burst-in {
        from {
          transform: skewX(-18deg) translateY(-110%);
        }
      }

      .verdict {
        display: grid;
        justify-items: center;
        gap: 0.4rem;
        text-align: center;
      }

      .verdict .eyebrow {
        color: var(--pink);
      }

      .verdict h1 {
        margin: 0;
        font-family: var(--display);
        font-weight: 400;
        font-size: clamp(2.6rem, 8vw, 5.2rem);
        line-height: 1;
        color: var(--ink);
        text-shadow:
          0.05em 0.05em 0 var(--yellow),
          0.1em 0.1em 0 var(--pink);
        animation: slam 0.7s var(--ease-pop) both;
      }

      .verdict p {
        margin: 0;
        word-break: auto-phrase;
        text-wrap: balance;
        font-weight: 700;
        color: var(--muted);
      }

      @keyframes slam {
        from {
          opacity: 0;
          transform: scale(1.8);
          filter: blur(8px);
        }
      }

      .podium {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 15rem));
        align-items: end;
        justify-content: center;
        gap: clamp(0.6rem, 2vw, 1.4rem);
        width: 100%;
      }

      .podium-slot {
        display: grid;
        justify-items: center;
        gap: 0.6rem;
        min-width: 0;
        animation: rise 0.9s var(--ease-pop) both;
        animation-delay: calc(0.4s + var(--d, 0) * 0.35s);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(4rem);
        }
      }

      .podium-slot.r1 {
        order: 2;
      }

      .podium-slot.r2 {
        order: 1;
      }

      .podium-slot.r3 {
        order: 3;
      }

      .podium-card-wrap {
        position: relative;
        display: grid;
        justify-items: center;
        width: 100%;
      }

      .podium-card {
        position: relative;
        width: 100%;
        aspect-ratio: 832 / 1216;
        border: 2px solid var(--edge);
        border-radius: 1.2rem;
        background: #fff;
        box-shadow: var(--lift);
        overflow: hidden;
      }

      .r1 .podium-card {
        border-color: var(--yellow);
        box-shadow:
          0 0 0 4px rgb(253 219 19 / 0.35),
          0 24px 40px -20px rgb(11 27 43 / 0.5);
      }

      .r2 .podium-card,
      .r3 .podium-card {
        width: 86%;
      }

      .podium-card svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .crown {
        position: absolute;
        top: -2.3rem;
        left: 50%;
        z-index: 2;
        translate: -50% 0;
        filter: drop-shadow(0 4px 6px rgb(11 27 43 / 0.25));
        animation: crown 1.2s var(--ease-pop) 1.4s both;
      }

      @keyframes crown {
        from {
          opacity: 0;
          transform: translateY(-2rem) rotate(-20deg) scale(0.6);
        }
      }

      .podium-who {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        max-width: 100%;
        font-weight: 700;
      }

      .podium-who .avatar {
        width: 1.9rem;
        height: 1.9rem;
        font-size: 0.8rem;
      }

      .podium-who b {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .podium-score {
        font-family: var(--display);
        font-size: 1.6rem;
        line-height: 1;
      }

      .r1 .podium-score {
        font-size: 2.1rem;
      }

      .step {
        display: grid;
        place-items: center;
        width: 100%;
        border-radius: 1rem 1rem 0 0;
        color: #fff;
        font-family: var(--display);
        font-size: 2rem;
      }

      .r1 .step {
        height: 6rem;
        background: linear-gradient(var(--pink), #e01572);
      }

      .r2 .step {
        height: 4.4rem;
        background: linear-gradient(var(--cyan), #0095d4);
      }

      .r3 .step {
        height: 3.2rem;
        background: linear-gradient(#ffd23d, #f0b400);
        color: var(--ink);
      }

      .is-me-slot .podium-who b::after {
        content: "（あなた）";
        color: var(--pink);
        font-weight: 500;
      }

      /* 全員の順位表 */
      .ranking {
        display: grid;
        gap: 0.5rem;
        width: min(100%, 44rem);
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .ranking li {
        display: grid;
        grid-template-columns: 2.4rem 2.6rem minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 0.8rem;
        padding: 0.55rem 1rem 0.55rem 0.7rem;
        border: 2px solid var(--edge);
        border-radius: 1rem;
        background: #fff;
        animation: rise 0.6s var(--ease-out) both;
        animation-delay: calc(1.6s + var(--d, 0) * 0.08s);
      }

      .ranking li.is-me {
        border-color: var(--pink);
        background: #fff7fb;
      }

      .ranking .no {
        font-family: var(--display);
        font-size: 1.2rem;
        text-align: center;
      }

      .ranking .thumb {
        width: 2.6rem;
        aspect-ratio: 832 / 1216;
        border-radius: 0.45rem;
        overflow: hidden;
        background: var(--ground);
      }

      .ranking .thumb svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .ranking .nm {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
        font-weight: 700;
      }

      .ranking .nm .avatar {
        width: 1.6rem;
        height: 1.6rem;
        font-size: 0.7rem;
      }

      .ranking .nm span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ranking .sub {
        align-self: center;
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--muted);
        white-space: nowrap;
      }

      .ranking .pt {
        font-family: var(--display);
        font-size: 1.2rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        animation: rise 0.6s var(--ease-out) 2s both;
      }

      .actions .pill {
        width: auto;
        min-width: 12rem;
      }

      .pill-x {
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }

      /* 紙吹雪 */
      .confetti {
        position: fixed;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        overflow: hidden;
      }

      .confetti i {
        position: absolute;
        top: -2rem;
        width: var(--w, 8px);
        height: var(--h, 14px);
        border-radius: 2px;
        background: var(--c);
        animation: fall var(--t, 3s) cubic-bezier(0.3, 0.6, 0.5, 1) var(--dl, 0s) forwards;
      }

      @keyframes fall {
        to {
          transform: translate(var(--x, 0), 110vh) rotate(var(--r, 720deg));
        }
      }

      /* ---------- スマホ ---------- */
      @media (max-width: 860px) {
        .stage {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          grid-template-areas:
            "topic mine"
            "panel panel";
          align-items: start;
          height: auto;
          min-height: 0;
          padding-top: 1rem;
          gap: 0.9rem 0.8rem;
        }
        .col-topic {
          grid-area: topic;
        }
        .col-mine {
          grid-area: mine;
        }
        .panel {
          grid-area: panel;
        }
        .frame {
          width: min(100%, calc(30svh * 832 / 1216));
          min-width: 0;
        }
        .podium {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .bar {
          height: 3.8rem;
          padding: 0 12px;
          gap: 0.5rem;
        }
        .bar img {
          width: 4.6rem;
        }
        .chip,
        .phase-label {
          display: none;
        }
        .col-label .eyebrow {
          display: none;
        }
        .ctl {
          padding: 0.35rem 0.7rem;
          font-size: 0.7rem;
        }
        .stage {
          padding: 0.8rem 12px 0.6rem;
          gap: 0.7rem 0.6rem;
        }
        .col-label {
          font-size: 0.7rem;
        }
        .frame {
          border-radius: 14px;
          width: min(100%, calc(31svh * 832 / 1216));
        }
        .panel {
          gap: 0.7rem;
          padding: 0.9rem;
          border-radius: 20px;
        }
        .who-name b {
          font-size: 1.1rem;
        }
        .avatar {
          width: 2.2rem;
          height: 2.2rem;
          font-size: 0.9rem;
        }
        .models {
          grid-template-columns: 1fr 1fr;
          gap: 0.25rem;
        }
        .model-cat {
          grid-column: 1 / -1;
        }
        .model {
          grid-template-columns: 1.15rem minmax(0, 1fr);
          padding: 0.35rem 0.45rem;
        }
        .model-val {
          grid-column: 2;
          font-size: 0.62rem;
        }
        .model-name b {
          font-size: 0.64rem;
        }
        .model-name small {
          display: none;
        }
        .model-ico {
          width: 1.15rem;
          height: 1.15rem;
        }
        .tags {
          grid-template-columns: 1fr;
        }
        .out {
          min-height: 6rem;
        }
        .log {
          display: none;
        }
        .rail {
          justify-content: flex-start;
          width: calc(100% - 24px);
          padding: 0.5rem;
          border-radius: 18px;
        }
        .seat {
          width: auto;
          padding: 0.3rem;
        }
        .seat-meta {
          display: none;
        }
        .seat-score {
          margin: 0 0.3rem 0 0;
          font-size: 0.85rem;
        }
        .seat-rank {
          left: 1.4rem;
        }
        .podium {
          gap: 0.4rem;
        }
        .podium-who {
          font-size: 0.72rem;
        }
        .podium-who .avatar {
          display: none;
        }
        .podium-score {
          font-size: 1.1rem;
        }
        .r1 .podium-score {
          font-size: 1.4rem;
        }
        .step {
          font-size: 1.3rem;
        }
        .r1 .step {
          height: 4rem;
        }
        .r2 .step {
          height: 3rem;
        }
        .r3 .step {
          height: 2.2rem;
        }
        .ranking li {
          grid-template-columns: 1.8rem 2rem minmax(0, 1fr) auto;
          gap: 0.5rem;
          padding: 0.45rem 0.7rem 0.45rem 0.5rem;
        }
        .ranking .sub {
          display: none;
        }
        .ranking .thumb {
          width: 2rem;
        }
        .actions .pill {
          min-width: 0;
          flex: 1 1 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0s !important;
          transition-duration: 0.01ms !important;
        }
        .confetti,
        .curtain {
          display: none;
        }
      }

      /* スマホの横向き: お題｜採点｜提出画像を横1列に並べ、画面の高さに収める */
      @media (orientation: landscape) and (max-height: 500px) {
        .bar {
          height: 3.2rem;
          padding: 0 max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
        }
        .bar img {
          width: 4.8rem;
        }
        .chip {
          display: none;
        }
        .stage {
          grid-template-columns: minmax(0, 1fr) minmax(15rem, 21rem) minmax(0, 1fr);
          grid-template-areas: "topic panel mine";
          align-items: center;
          height: calc(100svh - 3.2rem - 6px);
          min-height: 17rem;
          padding: 0.6rem max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
          gap: 0.9rem;
        }
        .col {
          align-content: center;
          gap: 0.4rem;
        }
        .col-label {
          font-size: 0.7rem;
        }
        .col-label .eyebrow {
          display: none;
        }
        .frame {
          width: min(100%, calc((100svh - 3.2rem - 6.5rem) * 832 / 1216));
          min-width: 0;
          border-radius: 0.9rem;
        }
        .panel {
          max-height: 100%;
          gap: 0.6rem;
          padding: 0.8rem 0.9rem;
          border-radius: 1.1rem;
          overflow-y: auto;
        }
        .rail {
          padding: 0.5rem;
          margin-bottom: 1rem;
        }
        .final {
          padding-top: 1rem;
          gap: 1rem;
        }
        /* 表彰台は画面の高さに収まる大きさにする */
        .podium {
          grid-template-columns: repeat(3, minmax(0, calc((100svh - 9rem) * 832 / 1216)));
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a href="index.html"><img src="images/animic-logo.svg" alt="Animic トップ" width="2078" height="607" /></a>
      <span class="chip">ルーム <code id="room-code"></code></span>
      <span class="chip chip-level" id="level-chip"></span>
      <div class="bar-right">
        <p class="phase-label" id="phase-label"><span class="eyebrow">Judging</span><b id="phase-count">1 / 4</b></p>
        <button class="ctl" type="button" id="fast" aria-pressed="false" title="採点の演出を3倍の速さで見る">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5l9 7-9 7zm9 0 9 7-9 7z" /></svg>×3
        </button>
        <button class="ctl" type="button" id="skip">
          スキップ
          <svg width="12" height="12" viewBox="0 0 20 16" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M4 2 13 8l-9 6V2Zm11 0v12" /></svg>
        </button>
      </div>
    </header>
    <div class="track" aria-hidden="true"><i id="track"></i></div>

    <!-- 採点ステージ: 一人ずつ、推論（約15秒）を見せてから点数を出す -->
    <main class="stage" id="stage" aria-live="polite">
      <div class="col col-topic">
        <p class="col-label"><span class="eyebrow">Topic</span>お題</p>
        <figure class="frame" id="topic-frame"></figure>
      </div>
      <section class="panel" id="panel" aria-label="採点"></section>
      <div class="col col-mine">
        <p class="col-label"><span class="eyebrow">Submitted</span><span id="mine-label">提出画像</span></p>
        <figure class="frame" id="mine-frame"></figure>
      </div>
    </main>
    <div class="rail" id="rail" aria-label="採点の順番"></div>

    <!-- 最終結果 -->
    <section class="final" id="final" hidden>
      <div class="burst" aria-hidden="true">
        <span style="left: 4%; width: 7rem; background: var(--cyan)"></span>
        <span style="left: 13%; width: 1.4rem; background: var(--yellow); animation-delay: 0.08s"></span>
        <span style="right: 10%; width: 6rem; background: var(--pink); animation-delay: 0.16s"></span>
        <span style="right: 4%; width: 1.2rem; background: var(--yellow); animation-delay: 0.24s"></span>
      </div>
      <div class="verdict">
        <p class="eyebrow">Final result</p>
        <h1 id="verdict-title">1st!</h1>
        <p id="verdict-sub"></p>
      </div>
      <div class="podium" id="podium" style="margin-top: 1.4rem"></div>
      <ol class="ranking" id="ranking" aria-label="順位"></ol>
      <div class="actions">
        <button class="pill pill-pink" type="button" id="rematch">同じメンバーで再戦</button>
        <button class="pill pill-x" type="button" id="share">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z" /></svg>
          結果をシェア
        </button>
        <button class="pill" type="button" id="home">トップへ戻る</button>
      </div>
    </section>

    <script src="common.js"></script>
    <script src="art.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const q = params();
      const code = isValidCode(q.get("code") || "") ? q.get("code") : randomCode();
      const level = q.get("level") || "かんたん";
      const total = Math.max(10, Number(q.get("time")) || 90);
      const role = q.get("role") || "host";
      // 1人あたりの推論時間（秒）。?infer= で変えられる
      const INFER = Math.max(2, Number(q.get("infer")) || 15) * 1000;

      // お題の画像（ロビー・対戦画面と同じ）
      const LEVELS = {
        かんたん: { en: "EASY", desc: "背景なし・1キャラクター", art: "images/sample-solo-white-bg.png" },
        ふつう: { en: "NORMAL", desc: "背景あり・1キャラクター", art: "images/sample-solo-with-bg.png" },
        むずかしい: { en: "HARD", desc: "背景あり・2キャラクター", art: "images/sample-duo-with-bg.png" },
      };
      const lv = LEVELS[level] || LEVELS.かんたん;

      // ---------- 参加者と提出内容 ----------
      // 提出内容は「特徴~再現度~残り秒~生成回数」、未提出は none。直接開いた場合はサンプルの4人
      function parse(value) {
        if (!value || value === "none") return null;
        const [f, sim, remain, gens] = String(value).split("~");
        return { features: artDecode(f), sim: Number(sim), remain: Number(remain), gens: Number(gens) };
      }
      let names, entries, seat;
      try {
        names = JSON.parse(q.get("players") || "null");
        entries = JSON.parse(q.get("entries") || "null");
      } catch {}
      seat = Number(q.get("seat")) || 0;
      if (!Array.isArray(names) || !Array.isArray(entries) || names.length !== entries.length) {
        if (q.get("me") || q.get("them")) {
          names = [q.get("name") || "ゲスト", q.get("opp") || "ぴよ丸"];
          entries = [q.get("me") || "none", q.get("them") || "none"];
        } else {
          names = [q.get("name") || "みく", "ぴよ丸", "ぴくせる侍", "プロンプト職人"];
          entries = ["pink.twin.blue.sailor.smile.white~88.4~41~3", "pink.bob.blue.sailor.smile.sky~79.2~22~5", "blonde.twin.red.hoodie.wink.white~71.6~30~2", "none"];
        }
        seat = 0;
      }
      const COLORS = [
        ["#ff2d87", "#fff"],
        ["#00b4fc", "#fff"],
        ["#fddb13", "#0b1b2b"],
        ["#ff72b9", "#fff"],
        ["#6fd3ff", "#0b1b2b"],
        ["#ffe98a", "#0b1b2b"],
        ["#5b6573", "#fff"],
      ];

      // 仮のスコア: 再現度 + 提出速度（最大20） + 生成回数（1回で15、1回増えるごとに-3）
      function score(e) {
        if (!e) return null;
        const speed = Math.round((Math.max(0, e.remain) / total) * 20);
        const gens = Math.max(0, 15 - (Math.max(1, e.gens) - 1) * 3);
        return { sim: e.sim, speed, gens, total: Math.round((e.sim + speed + gens) * 10) / 10 };
      }
      const players = names.map((name, i) => {
        const entry = parse(entries[i]);
        return { name: String(name), isMe: i === seat, bg: COLORS[i % COLORS.length][0], fg: COLORS[i % COLORS.length][1], entry, score: score(entry) };
      });
      const me = players[seat] || players[0];
      // 順位（同点は同じ順位、未提出は最下位）
      const ranked = [...players].sort((a, b) => (b.score ? b.score.total : -1) - (a.score ? a.score.total : -1));
      ranked.forEach((p, i) => {
        const prev = ranked[i - 1];
        p.rank = prev && (prev.score ? prev.score.total : -1) === (p.score ? p.score.total : -1) ? prev.rank : i + 1;
      });
      // 発表は下位から。最後に1位を出す
      const order = [...ranked].reverse();

      // ---------- 画面の準備 ----------
      $("room-code").textContent = code;
      $("level-chip").textContent = `${lv.en}・${lv.desc}`;
      $("topic-frame").innerHTML = `<img src="${lv.art}" alt="お題の画像" width="832" height="1216" style="object-position:50% 15%" />`;
      const initial = (p) => escapeHtml([...p.name][0]);
      const avatar = (p) => `<span class="avatar" style="--c:${p.bg};--fg:${p.fg}">${initial(p)}</span>`;
      const art = (p, label = "") => artSvg(p.entry.features, label).replace("<svg ", '<svg preserveAspectRatio="xMidYMax slice" ');
      const fmt = (n) => n.toFixed(1);
      const narrow = matchMedia("(max-width: 560px)").matches;

      function renderRail(now = -1) {
        $("rail").innerHTML = order
          .map((p, i) => {
            const state = i < now ? "is-scored" : i === now ? "is-now" : "is-wait";
            const label = i < now ? (p.score ? "採点済み" : "未提出") : i === now ? "採点中" : "待機中";
            return `<div class="seat ${state}${p.isMe ? " is-me" : ""}" style="--c:${p.bg}">
              ${i < now ? `<span class="seat-rank">${liveRank(p, now)}</span>` : ""}
              ${avatar(p)}
              <span class="seat-meta"><b>${escapeHtml(p.name)}</b><small>${label}</small></span>
              <span class="seat-score">${i < now ? (p.score ? fmt(p.score.total) : "—") : ""}</span>
            </div>`;
          })
          .join("");
      }
      // ここまでに発表した人の中での順位
      function liveRank(p, upto) {
        const shown = order.slice(0, upto).filter((x) => x.score);
        if (!p.score) return "—";
        return 1 + shown.filter((x) => x.score.total > p.score.total).length;
      }

      // ---------- 時間の進め方（早送りに対応した時計） ----------
      let speed = 1;
      let skipping = false;
      let clock = 0;
      let last = performance.now();
      const waiters = new Set();
      (function tick(now) {
        clock += (now - last) * speed;
        last = now;
        for (const w of [...waiters]) if (skipping || clock >= w.at) (waiters.delete(w), w.resolve());
        requestAnimationFrame(tick);
      })(last);
      const sleep = (ms) => new Promise((resolve) => waiters.add({ at: clock + ms, resolve }));

      $("fast").addEventListener("click", () => {
        speed = speed === 1 ? 3 : 1;
        $("fast").setAttribute("aria-pressed", String(speed !== 1));
        document.documentElement.style.setProperty("--speed", speed);
      });
      $("skip").addEventListener("click", () => {
        skipping = true;
      });

      // ---------- 採点の演出: 本体の再現度評価で使う6つのモデルを順に動かす ----------
      // docs/product.md「再現度評価で扱うモデル」: CCIP・WD14 tagger v3・DreamSim・SigLIP 2・DINOv2・Depth Anything V2
      // 指標の算出方法は未決定のため、値はモック（提出時の再現度に合うように作る）
      const MODELS = [
        // キャラクター一致度
        { id: "ccip", name: "CCIP", what: "キャラクター一致度", cat: "char", w: 0.25, ov: "face" },
        // タグ一致度
        { id: "wd14", name: "WD14 tagger v3", what: "タグ一致度", cat: "tag", w: 0.125, ov: null },
        { id: "pixai", name: "PixAI tagger", what: "タグ一致度", cat: "tag", w: 0.125, ov: null },
        // 内容一致度
        { id: "dreamsim", name: "DreamSim", what: "内容一致度", cat: "content", w: 0.0833, ov: "glow" },
        { id: "siglip", name: "SigLIP 2", what: "内容一致度", cat: "content", w: 0.0833, ov: "glow" },
        { id: "dino", name: "DINOv2", what: "内容一致度", cat: "content", w: 0.0834, ov: "patch" },
        // ポーズ一致度
        { id: "depth", name: "Depth Anything V2", what: "ポーズ一致度", cat: "pose", w: 0.125, ov: "depth" },
        { id: "openpose", name: "OpenPose", what: "ポーズ一致度", cat: "pose", w: 0.125, ov: "pose" },
      ];
      // 再現度の判定指標（4つ。今後減らしていく方針）
      const CATS = [
        ["char", "キャラクター一致度", "CCIP"],
        ["tag", "タグ一致度", "WD14・PixAI"],
        ["content", "内容一致度", "DreamSim・SigLIP 2・DINOv2"],
        ["pose", "ポーズ一致度", "Depth・OpenPose"],
      ];
      // お題のタグ（お題の画像に合わせる）
      const TOPIC_TAGS = {
        かんたん: ["1girl", "solo", "blonde hair", "very long hair", "low twintails", "yellow eyes", "beret", "pink headwear", "hair ribbon", "hoodie", "blue hoodie", "bike shorts", "smile", "white background", "looking at viewer"],
        ふつう: ["1girl", "solo", "blonde hair", "very long hair", "glasses", "red-framed eyewear", "yellow eyes", "beret", "hoodie", "blue hoodie", "open mouth", "waving", "outdoors", "tree", "looking at viewer"],
        むずかしい: ["2girls", "blonde hair", "white hair", "long hair", "beret", "pink headwear", "hoodie", "maid headdress", "black dress", "frills", "hug", "open mouth", "indoors", "looking at viewer"],
      }[level] || [];

      // モデルごとの値（0〜1）。プレイヤーごとに決まった値にする
      function metricsOf(p) {
        const rand = artRandom(`${code}-${p.name}-judge`);
        const base = p.score.sim / 100;
        const mine = ["1girl", "solo", "looking at viewer", ...ART_KEYS.map((k) => artPick(k, p.entry.features[k]).tag)];
        const conf = (t) => (0.55 + rand() * 0.43).toFixed(2);
        const sub = mine.map((t) => ({ t, c: conf(t), hit: TOPIC_TAGS.includes(t) }));
        const top = TOPIC_TAGS.map((t) => ({ t, c: conf(t), hit: mine.includes(t) }));
        const hits = sub.filter((x) => x.hit).length;
        const f1 = hits ? (2 * hits) / (sub.length + top.length) : 0;
        const v = {};
        for (const m of MODELS) v[m.id] = Math.min(0.99, Math.max(0.05, base + (rand() - 0.5) * 0.18));
        v.wd14 = Math.min(0.99, Math.max(0.05, base * 0.6 + f1 * 0.4));
        v.pixai = Math.min(0.99, Math.max(0.05, v.wd14 + (rand() - 0.5) * 0.08));
        // カテゴリごとの値を、重み付きの合計が提出時の再現度に合うようにそろえる
        const cats = {};
        for (const [c] of CATS) {
          const ms = MODELS.filter((m) => m.cat === c);
          cats[c] = ms.reduce((a, m) => a + v[m.id] * m.w, 0) / ms.reduce((a, m) => a + m.w, 0);
        }
        const weights = Object.fromEntries(CATS.map(([c]) => [c, MODELS.filter((m) => m.cat === c).reduce((a, m) => a + m.w, 0)]));
        const raw = CATS.reduce((a, [c]) => a + cats[c] * weights[c], 0);
        const shift = base - raw;
        for (const [c] of CATS) cats[c] = Math.min(0.995, Math.max(0.02, cats[c] + shift));
        return { v, cats, weights, sub, top, hits, rand };
      }
      // 表示する値（モデルごとの出力の形）
      const showVal = (m, x) =>
        ({
          wd14: `F1 ${x.toFixed(2)}`,
          ccip: `sim ${x.toFixed(3)}`,
          siglip: `cos ${x.toFixed(3)}`,
          dreamsim: `dist ${(1 - x).toFixed(3)}`,
          dino: `cos ${x.toFixed(3)}`,
          depth: `corr ${x.toFixed(3)}`,
          pixai: `F1 ${x.toFixed(2)}`,
          openpose: `OKS ${x.toFixed(3)}`,
        })[m.id];

      const ICON_DONE = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>';

      function panelHtml(p, i) {
        return `<div class="who">${avatar(p)}<div class="who-name"><span class="eyebrow">Now judging</span><b>${escapeHtml(p.name)}${p.isMe ? '<span class="me-tag">あなた</span>' : ""}</b></div><span class="who-order">${i + 1} / ${order.length}</span></div>
          <div class="infer">
            <div class="infer-row"><b id="infer-step">再現度を推論しています</b><span class="t" id="infer-t">0.0s</span></div>
            <div class="infer-bar"><i id="infer-bar"></i></div>
          </div>
          <ol class="models" id="models">${CATS.map(
            ([c, label]) =>
              `<li class="model-cat" data-cat="${c}"><span>${label}</span><b class="cat-val">—</b></li>` +
              MODELS.filter((m) => m.cat === c)
                .map((m) => `<li class="model" data-m="${m.id}"><span class="model-ico" aria-hidden="true"></span><span class="model-name"><b>${m.name}</b></span><span class="model-val">—</span></li>`)
                .join(""),
          ).join("")}</ol>
          <div class="out" id="out"></div>
          <div class="score">
            <div class="score-top">
              <div class="score-num"><span class="eyebrow">Score</span><b id="score-num">0.0<small>pt</small></b></div>
              <div class="stamp" id="stamp"></div>
            </div>
            <dl class="parts">
              <div><dt>再現度</dt><span class="meter"><i style="--c:var(--pink)" data-w="${p.score ? p.score.sim : 0}"></i></span><dd>${p.score ? fmt(p.score.sim) : "—"}</dd></div>
              <div><dt>回答時間</dt><span class="meter"><i style="--c:var(--cyan)" data-w="${p.score ? (p.score.speed / 20) * 100 : 0}"></i></span><dd>${p.score ? `+${p.score.speed}` : "—"}</dd></div>
              <div><dt>生成回数</dt><span class="meter"><i style="--c:#f5c400" data-w="${p.score ? (p.score.gens / 15) * 100 : 0}"></i></span><dd>${p.score ? `+${p.score.gens}` : "—"}</dd></div>
            </dl>
          </div>`;
      }

      async function curtain(p, i) {
        if (reducedMotion || skipping) return;
        const c = document.createElement("div");
        c.className = "curtain";
        c.setAttribute("aria-hidden", "true");
        c.innerHTML = `<span class="curtain-band"></span><span class="curtain-text"><span class="eyebrow">${i === order.length - 1 ? "And the last one" : `Entry ${String(i + 1).padStart(2, "0")}`}</span><b>${escapeHtml(p.name)}</b></span>`;
        c.querySelectorAll(".curtain-band, .curtain-text").forEach((el) => (el.style.animationDuration = `${1.5 / speed}s`));
        document.body.append(c);
        await sleep(1500);
        c.remove();
      }

      function countUp(el, to, ms) {
        const start = clock;
        return new Promise((resolve) => {
          (function step() {
            const t = skipping ? 1 : Math.min(1, (clock - start) / ms);
            el.innerHTML = `${fmt(to * (1 - Math.pow(1 - t, 4)))}<small>pt</small>`;
            if (t < 1) requestAnimationFrame(step);
            else resolve();
          })();
        });
      }

      // 画像に重ねる出力（DINOv2 のパッチ・CCIP の顔・深度・全体の光）を用意する
      function overlays(frame, rand, isTopic) {
        frame.querySelectorAll(".ov").forEach((o) => o.remove());
        const patch = Array.from({ length: 12 * 18 }, (_, k) => {
          const y = Math.floor(k / 12) / 18;
          const o = Math.min(0.5, Math.max(0, rand() * 0.35 + (y > 0.1 && y < 0.55 ? 0.15 : 0)));
          return `<i style="--c:${rand() < 0.5 ? "#ff2d87" : "#00b4fc"};--o:${o.toFixed(2)};--dl:${(k % 12) * 25 + Math.floor(k / 12) * 18}ms"></i>`;
        }).join("");
        frame.insertAdjacentHTML(
          "beforeend",
          `<span class="ov ov-glow" data-ov="glow"></span>
           <span class="ov ov-patch" data-ov="patch">${patch}</span>
           <span class="ov ov-depth" data-ov="depth"></span>
           <svg class="ov ov-pose" data-ov="pose" viewBox="0 0 100 146" preserveAspectRatio="none"><g fill="none" stroke-width="1.6" stroke-linecap="round">
             <path d="M50 30 L50 58" stroke="#ff2d87"/><path d="M50 36 L36 50 L30 66" stroke="#ffb200"/><path d="M50 36 L64 50 L70 66" stroke="#16b37e"/>
             <path d="M50 58 L42 88 L40 118" stroke="#00b4fc"/><path d="M50 58 L58 88 L60 118" stroke="#7c5cff"/><path d="M50 30 L46 24 M50 30 L54 24" stroke="#fddb13"/></g>
             <g fill="#fff" stroke="#0b1b2b" stroke-width=".6">${[[50,30],[50,36],[36,50],[30,66],[64,50],[70,66],[50,58],[42,88],[40,118],[58,88],[60,118],[46,24],[54,24]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.6"/>`).join("")}</g></svg>
           <span class="ov ov-face" data-ov="face"><span><b>${isTopic ? "face · topic" : "face · submit"}</b></span></span>`,
        );
      }
      function setOverlay(kind) {
        for (const f of [$("topic-frame"), $("mine-frame")]) {
          f.querySelectorAll(".ov").forEach((o) => o.classList.toggle("is-on", o.dataset.ov === kind));
          f.classList.toggle("is-depth", kind === "depth");
        }
      }

      // 動いているモデルの出力を、パネルの黒い欄に出す
      function outFor(m, M, pr) {
        const head = `<div class="out-head"><b>${m.name}</b><span>${m.what}</span><span>${Math.round(pr * 20) * 5}%</span></div>`;
        if (m.cat === "tag") {
          const n = Math.ceil(pr * Math.max(M.sub.length, M.top.length));
          const chips = (list) => list.slice(0, n).map((x) => `<span class="tg${x.hit ? " is-hit" : ""}">${escapeHtml(x.t)}<i>${x.c}</i></span>`).join("");
          return `${head}<div class="tags"><div><h4>お題</h4>${chips(M.top)}</div><div><h4>提出画像</h4>${chips(M.sub)}</div></div>`;
        }
        const val = M.v[m.id] * Math.min(1, Math.round(pr * 1.15 * 40) / 40);
        const cells = Array.from({ length: 64 }, (_, k) => {
          const on = k / 64 < Math.round(pr * 16) / 16;
          return `<i style="--c:${k % 2 ? "#00b4fc" : "#ff2d87"};--o:${on ? (0.25 + ((k * 37) % 70) / 100).toFixed(2) : 0.06}"></i>`;
        }).join("");
        const label = { ccip: "キャラクターの埋め込みの類似度", siglip: "画像の埋め込みのコサイン類似度", dreamsim: "知覚的な距離（小さいほど近い）", dino: "パッチ特徴の類似度", depth: "深度マップの相関" }[m.id];
        return `${head}<div class="metric"><div class="metric-big">${showVal(m, val)}<small>${label}</small></div><div class="vec">${cells}</div></div>`;
      }

      async function judge(p, i) {
        renderRail(i);
        $("phase-count").textContent = `${i + 1} / ${order.length}`;
        await curtain(p, i);
        const stage = $("stage");
        stage.classList.remove("is-done");
        $("panel").innerHTML = panelHtml(p, i);
        $("mine-label").textContent = narrow ? "提出画像" : `${p.name} の提出画像`;
        $("mine-frame").classList.remove("is-in");
        void $("mine-frame").offsetWidth;
        $("mine-frame").classList.add("is-in");
        $("mine-frame").innerHTML = p.entry
          ? `${art(p, `${p.name}さんの提出画像`)}<span class="scan" aria-hidden="true"></span>`
          : `<div class="missing"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M8 8l8 8" /></svg>未提出</div>`;
        setOverlay(null);

        if (!p.entry) {
          // 未提出は推論しない
          $("models").hidden = true;
          $("out").hidden = true;
          $("infer-step").textContent = "提出がないため、推論はしません";
          await sleep(1200);
          stage.classList.add("is-done");
          $("score-num").innerHTML = `<span style="font-size:.5em">未提出</span>`;
          document.querySelector(".parts").hidden = true;
          const st = $("stamp");
          st.style.setProperty("--c", "var(--muted)");
          st.innerHTML = "<small>NO ENTRY</small>未提出";
          st.classList.add("is-on");
          await sleep(1800);
          return;
        }

        // 推論: 6つのモデルを順に動かす（合わせて約15秒）。最後の1割で再現度を集計する
        const M = metricsOf(p);
        overlays($("topic-frame"), artRandom(`${code}-topic`), true);
        overlays($("mine-frame"), M.rand, false);
        stage.classList.add("is-infer");
        const RUN = INFER * 0.88;
        const span = RUN / MODELS.length;
        const start = clock;
        let cur = -1;
        await new Promise((resolve) => {
          (function step() {
            const t = Math.min(INFER, clock - start);
            const pr = skipping ? 1 : t / INFER;
            $("infer-bar").style.setProperty("--p", pr);
            $("infer-t").textContent = `${(t / 1000).toFixed(1)}s / ~${(INFER / 1000).toFixed(0)}s`;
            const k = Math.min(MODELS.length, Math.floor(t / span));
            // 終わったモデルに値を出す
            while (cur < k) {
              if (cur >= 0) {
                const m = MODELS[cur];
                const li = $("models").querySelector(`[data-m="${m.id}"]`);
                li.className = "model is-done";
                li.querySelector(".model-ico").innerHTML = ICON_DONE;
                li.querySelector(".model-val").textContent = showVal(m, M.v[m.id]);
                const sameCat = MODELS.filter((x) => x.cat === m.cat);
                if (sameCat[sameCat.length - 1] === m) {
                  const cv = $("models").querySelector(`[data-cat="${m.cat}"]`);
                  cv.classList.add("is-done");
                  cv.querySelector(".cat-val").textContent = (M.cats[m.cat] * 100).toFixed(1);
                }
              }
              cur++;
              if (cur < MODELS.length) {
                const m = MODELS[cur];
                $("models").querySelector(`[data-m="${m.id}"]`).className = "model is-run";
                $("infer-step").textContent = `${m.name} を実行中`;
                setOverlay(m.ov);
              } else {
                $("infer-step").textContent = "4つの指標から再現度を集計";
                setOverlay(null);
              }
            }
            if (cur < MODELS.length) {
              const m = MODELS[cur];
              const mp = Math.min(1, (t - cur * span) / span);
              $("models").querySelector(`[data-m="${m.id}"]`).style.setProperty("--p", mp);
              // 出力は中身が変わったときだけ描き直す（毎フレーム描き直すと登場の動きが始まり直すため）
              // 黒い出力欄は WD14 のタグだけに使う（ほかのモデルの値は一覧に出る）
              const isTag = m.cat === "tag";
              $("out").hidden = !isTag;
              const html = isTag ? outFor(m, M, mp) : "";
              if ($("out").dataset.last !== html) {
                $("out").dataset.last = html;
                $("out").innerHTML = html;
              }
            } else if (!$("out").dataset.agg) {
              // 再現度の集計: カテゴリごとの値と重み
              $("out").dataset.agg = "1";
              $("out").hidden = false;
              $("out").innerHTML = `<div class="out-head"><b>再現度の集計</b><span>重み付きの合計</span><span>${fmt(p.score.sim)}</span></div>
                <dl class="cats">${CATS.map(
                  ([c, label, by]) => `<div><dt>${label}<br /><span style="font-weight:500;color:#7f8fa3;font-family:var(--mono);font-size:.56rem">${by}・×${M.weights[c].toFixed(2)}</span></dt><span class="meter"><i style="--c:${c === "tag" ? "var(--ok)" : c === "char" ? "var(--yellow)" : c === "content" ? "var(--cyan)" : "var(--pink)"}" data-w="${(M.cats[c] * 100).toFixed(1)}"></i></span><dd>${(M.cats[c] * 100).toFixed(1)}</dd></div>`,
                ).join("")}</dl>`;
              requestAnimationFrame(() => $("out").querySelectorAll(".meter i").forEach((el) => (el.style.width = `${el.dataset.w}%`)));
            }
            if (pr >= 1) {
              if (skipping) {
                $("models").querySelectorAll(".model").forEach((li) => {
                  const m = MODELS.find((x) => x.id === li.dataset.m);
                  li.className = "model is-done";
                  li.querySelector(".model-val").textContent = showVal(m, M.v[m.id]);
                });
                $("models").querySelectorAll(".model-cat").forEach((cv) => (cv.classList.add("is-done"), (cv.querySelector(".cat-val").textContent = (M.cats[cv.dataset.cat] * 100).toFixed(1))));
              }
              resolve();
            } else requestAnimationFrame(step);
          })();
        });
        await sleep(900);
        stage.classList.remove("is-infer");
        setOverlay(null);
        stage.classList.add("is-done");

        // 点数を出す
        document.querySelectorAll(".parts .meter i").forEach((el) => (el.style.width = `${el.dataset.w}%`));
        await countUp($("score-num"), p.score.total, 1400);
        const r = liveRank(p, i + 1);
        const st = $("stamp");
        st.style.setProperty("--c", r === 1 ? "var(--pink)" : "var(--ink)");
        st.innerHTML = `<small>${r === 1 ? "TOP" : "RANK"}</small>現在 ${r}位`;
        st.classList.add("is-on");
        await sleep(2200);
      }

      // ---------- 最終結果 ----------
      function confetti() {
        if (reducedMotion) return;
        const c = document.createElement("div");
        c.className = "confetti";
        c.setAttribute("aria-hidden", "true");
        const colors = ["#ff2d87", "#00b4fc", "#fddb13", "#ff72b9", "#ffffff"];
        c.innerHTML = Array.from({ length: 110 }, () => {
          const w = 6 + Math.random() * 8;
          return `<i style="left:${Math.random() * 100}%;--c:${colors[Math.floor(Math.random() * colors.length)]};--w:${w}px;--h:${w * (1.2 + Math.random())}px;--x:${(Math.random() - 0.5) * 40}vw;--r:${(Math.random() - 0.5) * 1440}deg;--t:${2.4 + Math.random() * 2}s;--dl:${Math.random() * 0.8}s"></i>`;
        }).join("");
        document.body.append(c);
        setTimeout(() => c.remove(), 5600);
      }

      function showFinal() {
        $("stage").hidden = true;
        $("rail").hidden = true;
        $("fast").hidden = true;
        $("skip").hidden = true;
        $("phase-label").innerHTML = '<span class="eyebrow">Result</span><b>結果発表</b>';
        $("track").style.transform = "scaleX(1)";
        const submitted = players.some((p) => p.score);
        const ord = ["1st", "2nd", "3rd"];
        if (!submitted) {
          $("verdict-title").textContent = "NO GAME";
          $("verdict-sub").textContent = "誰も提出しなかったため、勝負不成立です";
        } else if (!me.score) {
          $("verdict-title").textContent = "NO ENTRY";
          $("verdict-sub").textContent = `今回は提出できませんでした。1位は ${ranked[0].name} さん`;
        } else {
          $("verdict-title").textContent = me.rank <= 3 ? `${ord[me.rank - 1]}!` : `${me.rank}th`;
          $("verdict-sub").textContent = me.rank === 1 ? `あなたが1位！ ${players.length}人の中でいちばんお題に近い1枚でした` : `あなたは ${players.length}人中 ${me.rank}位。1位は ${ranked[0].name} さん（${fmt(ranked[0].score.total)}pt）`;
        }
        const top = ranked.filter((p) => p.score).slice(0, 3);
        $("podium").innerHTML = top
          .map(
            (p, i) => `<div class="podium-slot r${i + 1}${p.isMe ? " is-me-slot" : ""}" style="--d:${2 - i}">
              <div class="podium-card-wrap">${i === 0 ? '<span class="crown"><svg width="56" height="42" viewBox="0 0 24 18" aria-hidden="true"><path d="M2 5l5 4 5-7 5 7 5-4-2 11H4z" fill="#fddb13" stroke="#0b1b2b" stroke-width="1.6" stroke-linejoin="round" /></svg></span>' : ""}<div class="podium-card">${art(p, `${p.name}さんの提出画像`)}</div></div>
              <div class="podium-who">${avatar(p)}<b>${escapeHtml(p.name)}</b></div>
              <div class="podium-score">${fmt(p.score.total)}</div>
              <div class="step">${p.rank}</div>
            </div>`,
          )
          .join("");
        $("ranking").innerHTML = ranked
          .map(
            (p, i) => `<li class="${p.isMe ? "is-me" : ""}" style="--d:${i}">
              <span class="no">${p.score ? p.rank : "—"}</span>
              <span class="thumb">${p.score ? art(p) : ""}</span>
              <span class="nm">${avatar(p)}<span>${escapeHtml(p.name)}${p.isMe ? "（あなた）" : ""}</span></span>
              <span class="sub">${p.score ? `再現度 ${fmt(p.score.sim)}・速度 +${p.score.speed}・回数 +${p.score.gens}` : "未提出"}</span>
              <span class="pt">${p.score ? fmt(p.score.total) : "—"}</span>
            </li>`,
          )
          .join("");
        $("final").hidden = false;
        scrollTo({ top: 0 });
        if (me.score && me.rank === 1) confetti();
        else if (submitted) setTimeout(confetti, 900);
      }

      async function run() {
        await playWipeOut();
        renderRail(0);
        if (reducedMotion) return showFinal();
        for (let i = 0; i < order.length; i++) {
          if (skipping) break;
          $("track").style.transform = `scaleX(${i / order.length})`;
          await judge(order[i], i);
        }
        $("track").style.transform = "scaleX(1)";
        showFinal();
      }
      run();

      const lobbyQuery = { code, name: me.name, role };
      $("rematch").addEventListener("click", (e) => wipeTo("lobby.html", lobbyQuery, e.currentTarget));
      $("home").addEventListener("click", (e) => wipeTo("index.html", {}, e.currentTarget));
      $("share").addEventListener("click", () => toast("シェアリンクをコピーしました"));
    </script>
  </body>
</html>
