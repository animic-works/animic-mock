<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="images/animic-favicon.svg" />
    <title>結果発表 | Animic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@900&family=Zen+Kaku+Gothic+New:wght@500;700&family=Montserrat:ital,wght@1,500;1,800&family=JetBrains+Mono:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/transition.css" />
    <script>
      // 前の画面から塗りつぶして来た場合、描画前に中身を隠す
      try {
        if (sessionStorage.getItem("animic-wipe")) document.documentElement.classList.add("wipe-pending");
      } catch {}
    </script>
    <link rel="stylesheet" href="css/result.css" />
  </head>
  <body>
    <header class="bar">
      <a href="index.html"><img src="images/animic-logo.svg" alt="Animic トップ" width="2078" height="607" /></a>
      <span class="chip">ルーム <code id="room-code"></code></span>
      <span class="chip chip-level" id="level-chip"></span>
      <div class="bar-right">
        <p class="phase-label" id="phase-label"><span class="eyebrow">Judging</span><b id="phase-count">1 / 4</b></p>
        <button class="ctl" type="button" id="fast" aria-pressed="false" title="採点の演出を3倍の速さで見る">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5l9 7-9 7zm9 0 9 7-9 7z" /></svg>×3
        </button>
        <button class="ctl" type="button" id="skip">
          スキップ
          <svg width="12" height="12" viewBox="0 0 20 16" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M4 2 13 8l-9 6V2Zm11 0v12" /></svg>
        </button>
      </div>
    </header>
    <div class="track" aria-hidden="true"><i id="track"></i></div>

    <!-- 採点ステージ: 一人ずつ、推論（約15秒）を見せてから点数を出す -->
    <main class="stage" id="stage" aria-live="polite">
      <div class="col col-topic">
        <p class="col-label"><span class="eyebrow">Topic</span>お題</p>
        <figure class="frame" id="topic-frame"></figure>
      </div>
      <section class="panel" id="panel" aria-label="採点"></section>
      <div class="col col-mine">
        <p class="col-label"><span class="eyebrow">Submitted</span><span id="mine-label">提出画像</span></p>
        <figure class="frame" id="mine-frame"></figure>
      </div>
    </main>
    <div class="rail" id="rail" aria-label="採点の順番"></div>

    <!-- 最終結果 -->
    <section class="final" id="final" hidden>
      <div class="burst" aria-hidden="true">
        <span style="left: 4%; width: 7rem; background: var(--cyan)"></span>
        <span style="left: 13%; width: 1.4rem; background: var(--yellow); animation-delay: 0.08s"></span>
        <span style="right: 10%; width: 6rem; background: var(--pink); animation-delay: 0.16s"></span>
        <span style="right: 4%; width: 1.2rem; background: var(--yellow); animation-delay: 0.24s"></span>
      </div>
      <div class="verdict">
        <p class="eyebrow">Final result</p>
        <h1 id="verdict-title">1st!</h1>
        <p id="verdict-sub"></p>
      </div>
      <div class="podium" id="podium" style="margin-top: 1.4rem"></div>
      <ol class="ranking" id="ranking" aria-label="順位"></ol>
      <div class="actions">
        <button class="pill pill-pink" type="button" id="rematch">同じメンバーで再戦</button>
        <button class="pill pill-x" type="button" id="share">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z" /></svg>
          結果をシェア
        </button>
        <button class="pill" type="button" id="home">トップへ戻る</button>
      </div>
    </section>

    <script src="js/common.js"></script>
    <script src="js/art.js"></script>
    <script src="js/result.js"></script>
  </body>
</html>
